# Keep the production service wiring, but never reuse its fixed container name.
# COMPOSE_PROJECT_NAME is supplied by buildUatComposeArgs via docker compose -p.
services:
  jarv1s:
    container_name: ${COMPOSE_PROJECT_NAME:?UAT project name required}-jarv1s-1
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 512
  postgres:
    cpus: 1.0
    mem_limit: 1g
  seed:
    environment:
      JARVIS_MODULES_DIR: /data/modules
    volumes:
      - jarv1s-modules:/data/modules
