# Keep the production service wiring, but never reuse its fixed container name.
# COMPOSE_PROJECT_NAME is supplied by buildUatComposeArgs via docker compose -p.
services:
  jarv1s:
    container_name: ${COMPOSE_PROJECT_NAME:?UAT project name required}-jarv1s-1
    cpus: 2.0
    # The server and the worker each load the local embedding model (~1.3 GB per copy, #2969).
    # With codex and the boot-time CLI install on top, a notes chat turn peaks near 3.8 GiB.
    mem_limit: 6g
    pids_limit: 512
    environment:
      # Test-only pair. Both default to the normal production values and are never set in a
      # deployment config. The calendar override is honored only when NODE_ENV is test or development.
      NODE_ENV: ${MOSS_UAT_NODE_ENV:-production}
      MOSS_TEST_GOOGLE_CALENDAR_BASE_URL: ${MOSS_TEST_GOOGLE_CALENDAR_BASE_URL:-}
  postgres:
    cpus: 1.0
    mem_limit: 1g
  seed:
    environment:
      JARVIS_MODULES_DIR: /data/modules
    volumes:
      - jarv1s-modules:/data/modules
