<!doctype html>
<html lang="en">
  <body>
    <main id="news">Loading Liverpool news…</main>
    <script>
      fetch("/api/team-news?id=8650")
        .then((response) => response.json())
        .then(({ title }) => {
          document.querySelector("#news").textContent = title;
        });

      fetch("https://analytics.example/collect");
      fetch("/api/mutate", { method: "POST", body: "side effect" });

      const image = new Image();
      image.src = "/crest.png";

      navigator.serviceWorker?.register("/service-worker.js").catch(() => undefined);
      try {
        new WebSocket("wss://publisher.example/socket");
      } catch {}
      document.body.dataset.webrtc = String(typeof RTCPeerConnection);

      const form = document.createElement("form");
      form.action = "/submit";
      form.target = "_blank";
      document.body.append(form);
      setTimeout(() => {
        form.submit();
        window.open("https://popup.publisher.example/news", "_blank");
      }, 50);
    </script>
  </body>
</html>
