name: TrailMarker
options:
  bundleIdPrefix: com.moss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    TRAIL_MARKER_DISTRIBUTION: "0"
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"

targets:
  TrailMarker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrailMarker
        excludes:
          - "Resources/Info.plist"
          - "Resources/TrailMarker.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moss.trailmarker
        PRODUCT_NAME: "Trail Marker"
        PRODUCT_MODULE_NAME: TrailMarker
        INFOPLIST_FILE: TrailMarker/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrailMarker/Resources/TrailMarker.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
    # Sparkle (Swift Package Manager) is wired in during Task 13.
    # packages: [Sparkle]

  TrailMarkerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrailMarkerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moss.trailmarker.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trail Marker.app/Contents/MacOS/Trail Marker"
    dependencies:
      - target: TrailMarker

schemes:
  TrailMarker:
    build:
      targets:
        TrailMarker: all
        TrailMarkerTests: [test]
    test:
      config: Debug
      targets:
        - TrailMarkerTests
