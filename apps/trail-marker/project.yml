name: TrailMarker
options:
  bundleIdPrefix: com.moss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    TRAIL_MARKER_DISTRIBUTION: "0"
    # Real key goes in for release builds only (Task 15); a blank key here means
    # Sparkle has nothing to verify against, which is fine for unsigned local/dev builds.
    TRAIL_MARKER_SPARKLE_PUBLIC_KEY: ""
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"

targets:
  TrailMarker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrailMarker
        excludes:
          - "Resources/Info.plist"
          - "Resources/TrailMarker.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moss.trailmarker
        PRODUCT_NAME: "Trail Marker"
        PRODUCT_MODULE_NAME: TrailMarker
        INFOPLIST_FILE: TrailMarker/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrailMarker/Resources/TrailMarker.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Moss forest (#173E2B), not the system blue, on every button, switch and sidebar
        # selection (Ben, 2026-09-23; Backtrack plan §3.4).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Notarization (release) needs it; development builds do not, and with a local signing
        # certificate it would refuse to load the debug library and Sparkle.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle

  TrailMarkerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrailMarkerTests
    # Backtrack plan §4.5: every test build checks that Backtrack data has no way out but its
    # sink, and that the check itself still catches planted violations.
    preBuildScripts:
      - name: Backtrack source check
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/check-backtrack-sources.sh" && "$SRCROOT/scripts/check-backtrack-sources.sh" --self-test
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.moss.trailmarker.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trail Marker.app/Contents/MacOS/Trail Marker"
    dependencies:
      - target: TrailMarker

  # Drives the real card in a window (Debug-only `-TMHostCardInWindow YES`), since XCUITest can't
  # open a status item's popover (Backtrack plan §3.5).
  TrailMarkerUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TrailMarkerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moss.trailmarker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrailMarker
    dependencies:
      - target: TrailMarker

schemes:
  TrailMarker:
    build:
      targets:
        TrailMarker: all
        TrailMarkerTests: [test]
        TrailMarkerUITests: [test]
    test:
      config: Debug
      targets:
        - TrailMarkerTests
        - TrailMarkerUITests
