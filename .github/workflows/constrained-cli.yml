name: Constrained Claude runner

on:
  pull_request:
    paths:
      - "packages/chat/src/live/constrained-**"
      - "scripts/*constrained-*"
      - ".github/workflows/constrained-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude:
    name: Verify pinned Claude local isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real native CLI against synthetic local fixtures and negative controls
        run: bash scripts/test-constrained-claude.sh
