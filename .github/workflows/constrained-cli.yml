name: Constrained subscription runners

on:
  pull_request:
    paths:
      - "packages/chat/src/live/constrained-**"
      - "scripts/*constrained-*"
      - ".github/workflows/constrained-cli.yml"
  workflow_dispatch:

# Superseded PR commits yield runners; other events get independent groups so
# even pending main, nightly and manual runs cannot replace one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Verify pinned ${{ matrix.display }} local isolation
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: codex
            display: Codex
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real native CLI against synthetic local fixtures and negative controls
        run: bash scripts/test-constrained-${{ matrix.provider }}.sh
