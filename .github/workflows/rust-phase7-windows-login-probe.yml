name: Rust phase7 Windows registration probe
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/rust-phase7-windows-login-probe.yml"]
permissions:
  contents: read
jobs:
  registration_probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compare scheduler XML encodings and namespaces as an ordinary user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'registration-probe'
          New-Item -ItemType Directory $work | Out-Null
          $script = Join-Path $work 'probe.py'
          @'
          import csv, html, pathlib, subprocess, sys
          root = pathlib.Path(__file__).parent
          sid = next(csv.reader(subprocess.check_output(['whoami.exe', '/USER', '/FO', 'CSV', '/NH'], text=True).splitlines()))[-1]
          template = '<?xml version="1.0" encoding="UTF-8"?><Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task"><Triggers><LogonTrigger><Enabled>true</Enabled><UserId>{sid}</UserId></LogonTrigger></Triggers><Principals><Principal id="Owner"><UserId>{sid}</UserId><LogonType>InteractiveToken</LogonType><RunLevel>LeastPrivilege</RunLevel></Principal></Principals><Settings><MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy><DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries><StopIfGoingOnBatteries>false</StopIfGoingOnBatteries><ExecutionTimeLimit>PT0S</ExecutionTimeLimit><Enabled>true</Enabled></Settings><Actions Context="Owner"><Exec><Command>{}</Command><Arguments>{arguments}</Arguments></Exec></Actions></Task>'
          for encoding in ('utf-8', 'utf-16'):
              for canonical in (False, True):
                  name = 'MossRegistrationProbe'
                  executable = str(pathlib.Path(sys.executable))
                  if canonical:
                      executable = chr(92)*2 + '?' + chr(92) + executable
                  xml = template.replace('UTF-8', 'UTF-16' if encoding == 'utf-16' else 'UTF-8').replace('{sid}', sid).replace('{arguments}', '--version').replace('{}', html.escape(executable))
                  path = root / 'task.xml'
                  path.write_text(xml, encoding=encoding)
                  filename = str(path)
                  if canonical:
                      filename = chr(92)*2 + '?' + chr(92) + filename
                  result = subprocess.run(['schtasks.exe', '/Create', '/TN', name, '/XML', filename, '/F'], capture_output=True, text=True)
                  print('PROBE:', encoding, 'canonical', canonical, 'exit', result.returncode, result.stdout.strip(), result.stderr.strip(), flush=True)
                  if result.returncode == 0:
                      subprocess.run(['schtasks.exe', '/Delete', '/TN', name, '/F'], check=True)
          '@ | Set-Content $script
          $account = 'moss-registration'
          $password = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + 'aA1!') -AsPlainText -Force
          $user = New-LocalUser -Name $account -Password $password -AccountNeverExpires
          try {
              Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $user
              & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)M') /Q
              $credential = [pscredential]::new("$env:COMPUTERNAME\$account", $password)
              $process = Start-Process (Get-Command python.exe).Source -Credential $credential -LoadUserProfile -WorkingDirectory $work -ArgumentList $script -RedirectStandardOutput "$work/out.txt" -RedirectStandardError "$work/err.txt" -PassThru
              if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Probe timeout' }
              Get-Content "$work/out.txt" -Tail 40
              Get-Content "$work/err.txt" -Tail 20
              if ($process.ExitCode -ne 0) { throw 'Probe failed' }
          } finally {
              Remove-LocalUser -Name $account
          }
