name: Rust phase7 Windows login probe
on:
  pull_request:
    paths: [".github/workflows/rust-phase7-windows-login-probe.yml"]
permissions:
  contents: read
jobs:
  login_probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Compare startup processing as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'login-probe'
          New-Item -ItemType Directory $work | Out-Null
          $script = Join-Path $work 'probe.py'
          @'
          import csv, html, pathlib, subprocess, sys, time
          root = pathlib.Path(__file__).parent
          if len(sys.argv) > 1:
              (root / sys.argv[1]).write_text('started')
              raise SystemExit(0)
          identity = subprocess.check_output(['whoami.exe', '/user', '/fo', 'csv', '/nh'], text=True)
          sid = next(csv.reader(identity.splitlines()))[1]
          for mode in ('InteractiveToken', 'S4U'):
              arguments = subprocess.list2cmdline([str(pathlib.Path(__file__)), mode])
              xml = f'''<?xml version="1.0" encoding="UTF-16"?><Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task"><Triggers><LogonTrigger><Enabled>true</Enabled><UserId>{sid}</UserId></LogonTrigger></Triggers><Principals><Principal id="Author"><UserId>{sid}</UserId><LogonType>{mode}</LogonType><RunLevel>LeastPrivilege</RunLevel></Principal></Principals><Settings><MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy><DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries><StopIfGoingOnBatteries>false</StopIfGoingOnBatteries><ExecutionTimeLimit>PT0S</ExecutionTimeLimit></Settings><Actions Context="Author"><Exec><Command>{html.escape(sys.executable)}</Command><Arguments>{html.escape(arguments)}</Arguments></Exec></Actions></Task>'''
              definition = root / 'task.xml'
              definition.write_text(xml, encoding='utf-16')
              result = subprocess.run(['schtasks.exe', '/Create', '/TN', 'MossLoginProbe', '/XML', str(definition), '/F'], stdin=subprocess.DEVNULL, capture_output=True, text=True)
              print('PROBE: own-user scheduler', mode, 'create exit', result.returncode, result.stdout.strip(), result.stderr.strip(), flush=True)
              if result.returncode == 0:
                  result = subprocess.run(['schtasks.exe', '/Run', '/TN', 'MossLoginProbe'])
                  time.sleep(15)
                  print('PROBE: own-user scheduler', mode, 'run exit', result.returncode, 'started', (root / mode).exists(), flush=True)
                  subprocess.run(['schtasks.exe', '/Query', '/TN', 'MossLoginProbe', '/V', '/FO', 'LIST'])
                  subprocess.run(['schtasks.exe', '/Delete', '/TN', 'MossLoginProbe', '/F'], check=True)
          '@ | Set-Content $script
          $account = 'moss-login-probe'
          $password = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + 'aA1!') -AsPlainText -Force
          $user = New-LocalUser -Name $account -Password $password -AccountNeverExpires
          try {
              Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $user
              & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)M') /Q
              if ($LASTEXITCODE -ne 0) { throw 'Could not grant probe access' }
              $credential = [pscredential]::new("$env:COMPUTERNAME\$account", $password)
              $process = Start-Process (Get-Command python.exe).Source -Credential $credential -LoadUserProfile -WorkingDirectory $work -ArgumentList $script -RedirectStandardOutput "$work/out.txt" -RedirectStandardError "$work/err.txt" -PassThru
              if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Probe timeout' }
              Get-Content "$work/out.txt" -Tail 30
              Get-Content "$work/err.txt" -Tail 30
              if ($process.ExitCode -ne 0) { throw 'Probe failed' }
          } finally {
              Remove-LocalUser -Name $account
          }
