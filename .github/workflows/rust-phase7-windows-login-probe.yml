name: Rust phase7 Windows login probe
on:
  pull_request:
    paths: [".github/workflows/rust-phase7-windows-login-probe.yml"]
permissions:
  contents: read
jobs:
  login_probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Exercise a real disposable standard-user logon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'login-probe'
          New-Item -ItemType Directory $work | Out-Null
          $script = Join-Path $work 'probe.py'
          @'
          import pathlib, subprocess, sys, time, winreg
          root = pathlib.Path(__file__).parent
          if len(sys.argv) > 1:
              (root / 'shell-started').write_text('started')
              raise SystemExit(0)
          entry = subprocess.list2cmdline([sys.executable, str(pathlib.Path(__file__)), 'login'])
          with winreg.CreateKey(winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Run') as registry:
              winreg.SetValueEx(registry, 'MossLoginProbe', 0, winreg.REG_SZ, entry)
          (root / 'registered').write_text('registered')
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline and not (root / 'shell-started').exists():
              time.sleep(1)
          print('PROBE: real native logon processed Run entry', (root / 'shell-started').exists(), flush=True)
          assert (root / 'shell-started').exists()
          '@ | Set-Content $script
          $account = 'moss-login-probe'
          $password = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + 'aA1!') -AsPlainText -Force
          $user = New-LocalUser -Name $account -Password $password -AccountNeverExpires
          try {
              Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545') -Member $user
              Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-555') -Member $user
              & icacls $work /grant ('*' + $user.SID.Value + ':(OI)(CI)M') /Q
              if ($LASTEXITCODE -ne 0) { throw 'Could not grant probe access' }
              $credential = [pscredential]::new("$env:COMPUTERNAME\$account", $password)
              $process = Start-Process (Get-Command python.exe).Source -Credential $credential -LoadUserProfile -WorkingDirectory $work -ArgumentList $script -RedirectStandardOutput "$work/out.txt" -RedirectStandardError "$work/err.txt" -PassThru
              $deadline = (Get-Date).AddSeconds(30)
              while (-not (Test-Path "$work/registered") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
              if (-not (Test-Path "$work/registered")) { throw 'Registry probe did not start' }
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
              Start-Service TermService
              Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ProbeCredential {
              [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
              public struct Credential {
                  public uint Flags, Type;
                  public string TargetName, Comment;
                  public long LastWritten;
                  public uint BlobSize;
                  public IntPtr Blob;
                  public uint Persist, AttributeCount;
                  public IntPtr Attributes;
                  public string TargetAlias, UserName;
              }
              [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern bool CredWriteW(ref Credential credential, uint flags);
              [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern bool CredDeleteW(string target, uint type, uint flags);
          }
          '@
              $entry = [ProbeCredential+Credential]::new()
              $entry.Type = 1
              $entry.TargetName = 'TERMSRV/127.0.0.2'
              $entry.UserName = "$env:COMPUTERNAME\$account"
              $entry.Persist = 2
              $entry.BlobSize = $password.Length * 2
              $entry.Blob = [Runtime.InteropServices.Marshal]::SecureStringToCoTaskMemUnicode($password)
              try {
                  if (-not [ProbeCredential]::CredWriteW([ref]$entry, 0)) { throw 'Credential probe setup failed' }
              } finally {
                  [Runtime.InteropServices.Marshal]::ZeroFreeCoTaskMemUnicode($entry.Blob)
              }
              @"
          full address:s:127.0.0.2
          username:s:$env:COMPUTERNAME\$account
          prompt for credentials:i:0
          authentication level:i:0
          enablecredsspsupport:i:1
          screen mode id:i:1
          desktopwidth:i:1280
          desktopheight:i:720
          "@ | Set-Content "$work/probe.rdp"
              $client = Start-Process mstsc.exe -ArgumentList "$work/probe.rdp" -PassThru
              if (-not $process.WaitForExit(150000)) { $process.Kill($true); throw 'Probe timeout' }
              Get-Content "$work/out.txt" -Tail 10
              Get-Content "$work/err.txt" -Tail 10
              & quser.exe
              if ($process.ExitCode -ne 0) { throw 'Real logon probe failed' }
          } finally {
              [ProbeCredential]::CredDeleteW('TERMSRV/127.0.0.2', 1, 0) | Out-Null
              Remove-LocalUser -Name $account
          }
