name: Edge publish alarm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  alarm:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report edge publish status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          label=edge-publish-alarm
          open_issues=$(gh issue list --repo "$REPO" --label "$label" --state open --limit 100 --json number --jq '.[].number')

          if [ "$CONCLUSION" = success ]; then
            for issue in $open_issues; do
              gh issue comment "$issue" --repo "$REPO" --body ":edge published from $SHA"
              gh issue close "$issue" --repo "$REPO"
            done
            exit 0
          fi

          publish_conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Build and publish images") | .conclusion' | tail -n 1)
          publish_conclusion=${publish_conclusion:-never ran}
          commit_title=${HEAD_COMMIT_MESSAGE%%$'\n'*}
          short_sha=${SHA:0:7}
          printf -v body 'Full head SHA: `%s`\n\nHead commit: %s\n\nPublish job: `%s`\n\nRun: %s\n\nProd continues running the previous `:edge`.' \
            "$SHA" "$commit_title" "$publish_conclusion" "$RUN_URL"

          if [ -n "$open_issues" ]; then
            gh issue comment "${open_issues%%$'\n'*}" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label "$label" \
              --title "ALARM: main $short_sha did not reach :edge" --body "$body"
          fi

          echo "::error title=Edge not published::main $SHA did not reach :edge (publish: $publish_conclusion)"
          exit 1
