name: Vocci Android

on:
  pull_request:
    paths:
      - "apps/vocci-delivery/**"
      - ".github/workflows/vocci-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/vocci-delivery/**"
      - ".github/workflows/vocci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android protocol and APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android platform tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol tests and development APK signature
        run: apps/vocci-delivery/test.sh
