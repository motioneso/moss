name: Trail Marker (macOS)

on:
  push:
    branches:
      - main
    paths:
      - "apps/trail-marker/**"
      - ".github/workflows/trail-marker-mac.yml"
  pull_request:
    paths:
      - "apps/trail-marker/**"
      - ".github/workflows/trail-marker-mac.yml"

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline build and test
    runs-on: macos-15
    # Keep the original build, portable, SDK, unit and UI checks unchanged.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/trail-marker
        run: xcodegen generate

      - name: Verify bounded audio mailbox concurrency and negative controls
        working-directory: apps/trail-marker
        run: python3 scripts/check-meeting-audio-portable.py

      - name: Verify path-only process reads and BSD-denial regression
        working-directory: apps/trail-marker
        run: python3 scripts/check-meeting-process-path-portable.py

      - name: Verify tap UID ownership in the installed Apple SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          sdk = Path(subprocess.check_output(["xcrun", "--show-sdk-path"], text=True).strip())
          header = sdk / "System/Library/Frameworks/CoreAudio.framework/Headers/AudioHardware.h"
          match = re.search(r"@constant\s+kAudioTapPropertyUID\b(.*?)(?=@constant|\*/)", header.read_text(), re.S)
          if match is None:
              raise SystemExit("Installed Apple SDK has no tap UID ownership contract")
          contract = " ".join(match.group(1).split())
          print("Installed Apple SDK kAudioTapPropertyUID:", contract)
          if "caller is responsible for releasing the returned CFObject" not in contract:
              raise SystemExit("Recheck the native tap UID ownership transfer against this SDK")
          PY

      - name: Compile Release without signing
        working-directory: apps/trail-marker
        run: |
          xcodebuild build \
            -scheme TrailMarker \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The UI tests (TrailMarkerUITests) need macOS UI automation, which otherwise waits for a
      # password prompt nobody can answer on a runner.
      - name: Enable UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Build and test
        working-directory: apps/trail-marker
        run: |
          xcodebuild test \
            -scheme TrailMarker \
            -destination 'platform=macOS'

  negative-controls:
    name: Negative controls (${{ matrix.group }})
    needs: baseline
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      # One broken control must not cancel another group's proof or artifact upload.
      fail-fast: false
      matrix:
        include:
          - group: audio
            script: check-meeting-negative-controls.py
          - group: visibility-and-unlink
            script: check-meeting-link-negative-controls.py
          - group: resume
            script: check-meeting-resume-negative-controls.py
          - group: source-selection
            script: check-meeting-source-negative-controls.py
          - group: voice-processing
            script: check-meeting-voice-negative-controls.py
          - group: recovery
            script: check-meeting-single-link-controls.py
          - group: source-reconfiguration
            script: check-meeting-reconfiguration-negative-controls.py
          - group: staged-acquisition
            script: check-meeting-acquisition-negative-controls.py

    steps:
      # Every matrix job gets a fresh checkout and its own Xcode build products.
      # Never share a mutable checkout or DerivedData between mutation runners.
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/trail-marker
        run: xcodegen generate

      - name: Enable UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      # Run the same positive suite in the cold checkout before mutating it. This
      # also builds dependencies outside the existing 300-second mutation timeout.
      - name: Build and test before mutations
        working-directory: apps/trail-marker
        run: |
          xcodebuild test \
            -scheme TrailMarker \
            -destination 'platform=macOS'

      # Runners remain unchanged: each mutation must fail its named assertion,
      # then pass after byte-for-byte restoration. No selectors omit controls.
      - name: Verify native negative controls
        working-directory: apps/trail-marker
        env:
          CONTROL_SCRIPT: ${{ matrix.script }}
        run: python3 "scripts/$CONTROL_SCRIPT"

      - name: Preserve native negative-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trail-marker-negative-controls-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/meeting-negative-controls-*/
            ${{ runner.temp }}/meeting-link-negative-*/
            ${{ runner.temp }}/meeting-single-link-negative-*/
            ${{ runner.temp }}/meeting-resume-negative-*/
            ${{ runner.temp }}/meeting-source-negative-*/
            ${{ runner.temp }}/meeting-reconfiguration-negative-*/
            ${{ runner.temp }}/meeting-acquisition-negative-*/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing check name, but never turn a failed, skipped,
  # cancelled or timed-out prerequisite into a successful aggregate check.
  test:
    name: Build and test
    if: always()
    needs: [baseline, negative-controls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Mac job to succeed
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          NEGATIVE_CONTROLS_RESULT: ${{ needs.negative-controls.result }}
        run: |
          test "$BASELINE_RESULT" = success
          test "$NEGATIVE_CONTROLS_RESULT" = success
