name: weekly-digest

# Builds and publishes the Moss weekly page every Friday at 06:00 Pacific.
#
# The words come from the "Release note" section each pull request fills in, so nothing has to be
# written again here. The finished page is committed to the gh-pages branch and deployed from
# there: a branch rule refuses direct pushes to main, which is what silently broke the previous
# version of this job.

on:
  schedule:
    # GitHub cron is UTC. The hour guard below keeps this at 06:00 Pacific across daylight saving.
    - cron: "0 13 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Keep scheduled runs at 06:00 Pacific
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=America/Los_Angeles date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "friday=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the renderer
        if: steps.clock.outputs.run == 'true'
        run: node tools/weekly-digest/render.mjs --self-test

      - name: Check out the published site
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Build this week's page
        id: build
        if: steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRIDAY: ${{ steps.clock.outputs.friday }}
        run: |
          node tools/weekly-digest/collect.mjs --friday "$FRIDAY" --repo "$GITHUB_REPOSITORY" > /tmp/notes.json
          if [[ ! -s /tmp/notes.json ]]; then
            echo "Nothing user-facing merged this week; leaving the page alone"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/weekly-digest/render.mjs --stamp /tmp/notes.json --archive-dir site/archive --friday "$FRIDAY" > /tmp/content.json
          node tools/weekly-digest/render.mjs /tmp/content.json --out site
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.build.outputs.built == 'true'
        working-directory: site
        env:
          FRIDAY: ${{ steps.clock.outputs.friday }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all .
          if git diff --cached --quiet; then
            echo "The page is already current"
          else
            git commit -m "Publish Moss weekly digest for $FRIDAY"
            git push
          fi

      - name: Drop the git directory before uploading
        if: steps.build.outputs.built == 'true'
        run: rm -rf site/.git

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.built == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.built == 'true'
        with:
          path: site
      - id: deployment
        if: steps.build.outputs.built == 'true'
        uses: actions/deploy-pages@v4
