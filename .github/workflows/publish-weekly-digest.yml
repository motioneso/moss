name: publish-weekly-digest

# Publishes whatever is on the gh-pages branch to GitHub Pages.
#
# The digest itself is written and committed by the local Friday agent
# (scripts/setup-weekly-digest-automation.sh), which triggers this workflow after pushing.
# It is run by hand from the Actions tab to republish without regenerating.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
