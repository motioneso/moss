name: weekly-release

on:
  schedule:
    # GitHub cron is UTC. The hour guard keeps this at 06:00 Pacific across DST.
    - cron: "0 13 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  # The report is published straight from the build artifact; nothing is committed
  # back to the repository. There used to be a "Commit report archive" step that
  # pushed docs/releases to main. Since the "Require CI gate on main" ruleset was
  # added on 2026-08-16 that push is rejected (GH013: required status check
  # "CI gate" is expected) because a direct push can never produce a gate run, and
  # the failing step took the Pages deploy down with it. Do not re-add it: publish
  # from the artifact, or land pages through a pull request if they must be kept.
  generate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Keep scheduled runs at 06:00 Pacific
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=America/Los_Angeles date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check generator
        if: steps.clock.outputs.run == 'true'
        run: node scripts/generate-weekly-release.mjs --self-test
      - name: Generate report
        if: steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-weekly-release.mjs
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: docs/releases

  deploy:
    if: needs.generate.outputs.publish == 'true'
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
