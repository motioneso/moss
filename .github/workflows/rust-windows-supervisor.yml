name: Rust Windows database supervisor
on:
  pull_request:
    paths:
      - "rust-spike/bundled-db/**"
      - "rust-spike/portability/**"
      - "rust-spike/shell/connect/**"
      - ".github/workflows/rust-windows-supervisor.yml"
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/.rust-sup/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rust-sup/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rust-sup/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Provision the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the database supervisor
        run: cargo +1.95.0 build --locked --manifest-path rust-spike/Cargo.toml -p bundled-db --bin moss-db
      - name: Make a database bundle that includes the vector extension
        shell: pwsh
        run: |
          $pg = $env:PGROOT
          if (-not $pg) { $pg = (Get-ChildItem 'C:\Program Files\PostgreSQL' | Sort-Object Name | Select-Object -Last 1).FullName }
          Write-Output "Postgres at $pg"
          git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git "$env:RUNNER_TEMP\pgvector"
          $vcvars = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $env:PGROOT = $pg
          cmd /c "`"$vcvars\VC\Auxiliary\Build\vcvars64.bat`" && cd /d `"$env:RUNNER_TEMP\pgvector`" && nmake /NOLOGO /F Makefile.win && nmake /NOLOGO /F Makefile.win install"
          if ($LASTEXITCODE -ne 0) { throw 'pgvector build failed' }
          New-Item -ItemType Directory -Path .rust-sup/bundle -Force | Out-Null
          Copy-Item $pg .rust-sup/bundle/postgres -Recurse
      - name: Start, stop and restart the private database as a standard user
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          ./rust-spike/bundled-db/proof/windows/supervisor.ps1 -MossDb "$root\.rust-sup\target\debug\moss-db.exe" -Postgres "$root\.rust-sup\bundle\postgres" -Repo $root
