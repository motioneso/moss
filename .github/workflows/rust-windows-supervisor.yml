name: Rust Windows database supervisor
on:
  pull_request:
    paths:
      - "rust-spike/bundled-db/**"
      - "rust-spike/portability/**"
      - "rust-spike/shell/**"
      - "rust-spike/network/**"
      - ".github/workflows/rust-windows-supervisor.yml"
# Superseded PR commits yield runners; other events get independent groups so
# even pending main, nightly and manual runs cannot replace one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  supervisor:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Keep file contents byte-exact on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Keep Rust build folders in runner scratch
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/rust-sup/cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP/rust-sup/rustup" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/rust-sup/target" >> $env:GITHUB_ENV
      - name: Provision the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the database supervisor
        run: cargo +1.95.0 build --locked --manifest-path rust-spike/Cargo.toml -p bundled-db --bin moss-db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/phase7-pg/downloads
          key: phase7-pg-sources-${{ runner.os }}-${{ hashFiles('rust-spike/bundled-db/tools/sources.json') }}
      - name: Build the same pinned source database as phase7_pg_bundle
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r rust-spike/bundled-db/tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked tool install failed' }
          & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed bison flex
          if ($LASTEXITCODE -ne 0) { throw 'Declared parser build dependencies unavailable' }
          $env:PATH += ';C:\msys64\usr\bin'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python rust-spike/bundled-db/tools/build-pg-bundle.py --scratch `"$env:RUNNER_TEMP\phase7-pg`" --out `"$env:RUNNER_TEMP\postgres`""
          if ($LASTEXITCODE -ne 0) { throw 'Pinned database build failed' }
      - name: Start, stop and restart the private database as a standard user
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          ./rust-spike/bundled-db/proof/windows/supervisor.ps1 -MossDb "$env:CARGO_TARGET_DIR\debug\moss-db.exe" -Postgres "$env:RUNNER_TEMP\postgres" -Repo $root
      - name: Disk encryption check as administrator and as a standard user
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          ./rust-spike/bundled-db/proof/windows/at-rest.ps1 -MossDb "$env:CARGO_TARGET_DIR\debug\moss-db.exe"
      - name: Build the server and the app's proof program
        run: |
          cargo +1.95.0 build --locked --manifest-path rust-spike/shell/Cargo.toml -p moss-shell -p moss-app
          cargo +1.95.0 test --locked --manifest-path rust-spike/shell/Cargo.toml -p moss-app --no-run --message-format=json > $env:RUNNER_TEMP/app-build.jsonl
      - name: App sets up, starts, stops and restarts the whole local server as a standard user
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $bin = "$env:CARGO_TARGET_DIR\debug"
          $exe = Get-Content $env:RUNNER_TEMP/app-build.jsonl | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
            Where-Object { $_.executable -and $_.target.name -eq 'moss-app' -and $_.profile.test } | Select-Object -Last 1
          ./rust-spike/shell/tools/windows-lifecycle.ps1 -Bin $bin -Postgres "$env:RUNNER_TEMP\postgres" -Repo $root -TestExe $exe.executable -AppExe "$bin\moss-app.exe"
