name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      source_sha:
        description: Full main commit SHA already published as edge
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/motioneso/moss
  RENDERER_IMAGE: ghcr.io/motioneso/moss-sports-renderer

jobs:
  release:
    name: Promote tested image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must match vX.Y.Z"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase commit SHA"
            exit 1
          fi

          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" --jq .status)
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "::error::$SOURCE_SHA is not on main"
            exit 1
          fi

          edge_manifest=$(docker buildx imagetools inspect "$IMAGE:edge" --format '{{json .Manifest}}')
          edge_digest=$(jq -er .digest <<< "$edge_manifest")
          provenance=$(docker buildx imagetools inspect "$IMAGE:edge" --format '{{json .Provenance}}')
          if ! jq -e --arg sha "$SOURCE_SHA" '([.. | objects | .["vcs:revision"]? // empty] | unique) == [$sha]' <<< "$provenance" >/dev/null; then
            echo "::error::edge provenance does not match $SOURCE_SHA"
            exit 1
          fi

          renderer_edge_manifest=$(docker buildx imagetools inspect "$RENDERER_IMAGE:edge" --format '{{json .Manifest}}')
          renderer_edge_digest=$(jq -er .digest <<< "$renderer_edge_manifest")
          renderer_provenance=$(docker buildx imagetools inspect "$RENDERER_IMAGE:edge" --format '{{json .Provenance}}')
          if ! jq -e --arg sha "$SOURCE_SHA" '([.. | objects | .["vcs:revision"]? // empty] | unique) == [$sha]' <<< "$renderer_provenance" >/dev/null; then
            echo "::error::renderer edge provenance does not match $SOURCE_SHA"
            exit 1
          fi

          version_exists=false
          if version_manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' 2>/dev/null); then
            version_digest=$(jq -er .digest <<< "$version_manifest")
            if [[ "$version_digest" != "$edge_digest" ]]; then
              echo "::error::$VERSION already points to a different digest"
              exit 1
            fi
            version_exists=true
          fi

          renderer_version_exists=false
          if renderer_version_manifest=$(docker buildx imagetools inspect "$RENDERER_IMAGE:$VERSION" --format '{{json .Manifest}}' 2>/dev/null); then
            renderer_version_digest=$(jq -er .digest <<< "$renderer_version_manifest")
            if [[ "$renderer_version_digest" != "$renderer_edge_digest" ]]; then
              echo "::error::renderer $VERSION already points to a different digest"
              exit 1
            fi
            renderer_version_exists=true
          fi

          tag_exists=false
          if tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" 2>/dev/null); then
            if ! jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$tag_ref" >/dev/null; then
              echo "::error::Git tag $VERSION already points elsewhere"
              exit 1
            fi
            tag_exists=true
          fi

          echo "edge_digest=$edge_digest" >> "$GITHUB_OUTPUT"
          echo "renderer_edge_digest=$renderer_edge_digest" >> "$GITHUB_OUTPUT"
          echo "renderer_version_exists=$renderer_version_exists" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "version_exists=$version_exists" >> "$GITHUB_OUTPUT"

      - name: Promote image without rebuilding
        env:
          EDGE_DIGEST: ${{ steps.source.outputs.edge_digest }}
          RENDERER_EDGE_DIGEST: ${{ steps.source.outputs.renderer_edge_digest }}
          RENDERER_VERSION_EXISTS: ${{ steps.source.outputs.renderer_version_exists }}
          VERSION: ${{ inputs.version }}
          VERSION_EXISTS: ${{ steps.source.outputs.version_exists }}
        run: |
          set -euo pipefail
          promote() {
            local image=$1 digest=$2 version_exists=$3
            local tags=(--tag "$image:stable")
            if [[ "$version_exists" != "true" ]]; then
              tags+=(--tag "$image:$VERSION")
            fi
            docker buildx imagetools create "${tags[@]}" "$image@$digest"

            for tag in "$VERSION" stable; do
              actual=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -er .digest)
              if [[ "$actual" != "$digest" ]]; then
                echo "::error::$image:$tag resolved to $actual, expected $digest"
                exit 1
              fi
            done
          }

          promote "$IMAGE" "$EDGE_DIGEST" "$VERSION_EXISTS"
          promote "$RENDERER_IMAGE" "$RENDERER_EDGE_DIGEST" "$RENDERER_VERSION_EXISTS"

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_EXISTS: ${{ steps.source.outputs.tag_exists }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists."
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          else
            gh release create "$VERSION" --target "$SOURCE_SHA" --generate-notes --title "$VERSION"
          fi
