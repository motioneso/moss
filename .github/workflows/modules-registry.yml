# #964: publishes external modules to the rolling GitHub Release tagged `modules`.
# The release IS the module registry: index.json + <id>-<version>.tgz assets. Runs on
# main pushes that touch module sources, and manually. Serialized (no concurrent runs)
# because the previousVersions merge reads the release's current index.json.
name: modules-registry

on:
  push:
    branches: [main]
    paths:
      - "external-modules/**"
      # #1747: bundled into every module's dist/, so a change here really does change every
      # published artifact. Leaving it out of this list is why an SDK change used to strand the
      # registry silently — no publish ran at all, and the next unrelated module merge inherited
      # the failure. modules-registry-check.yml forces the version bumps on the PR, so by the time
      # a change gets here it is publishable.
      - "packages/module-sdk/**"
      - "scripts/publish-module-registry.ts"
      - ".github/workflows/modules-registry.yml"
  workflow_dispatch:

permissions:
  contents: write
  # #1747: the failure step files an issue when a publish breaks.
  issues: write

concurrency:
  group: modules-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download current index (absent on first publish)
        run: |
          mkdir -p /tmp/registry-prev
          gh release download modules --pattern index.json --dir /tmp/registry-prev \
            || echo "no existing modules release/index — publishing fresh"
      - name: Build registry artifacts
        env:
          MOSS_MODULE_CATALOG_SIGNING_KEY_ID: ${{ secrets.MOSS_MODULE_CATALOG_SIGNING_KEY_ID }}
          MOSS_MODULE_CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.MOSS_MODULE_CATALOG_SIGNING_PRIVATE_KEY }}
        run: pnpm tsx scripts/publish-module-registry.ts --out dist/registry --previous-index /tmp/registry-prev/index.json --require-signature
      - name: Ensure rolling release exists
        run: |
          gh release view modules \
            || gh release create modules --title "Module registry" --latest=false \
                 --notes "Rolling module-distribution release. Assets are managed by the modules-registry workflow — do not edit by hand."
      # #1319 ledger #10: index.json and index.json.sig upload as separate assets with no
      # cross-asset atomicity. During the seconds between the two updates an enforcing Moss
      # instance can read a mismatched pair and report "unverified" — fails closed, self-heals
      # on the next fetch. Accepted, not engineered around.
      - name: Upload assets (same-version changes are rejected before this step)
        run: gh release upload modules dist/registry/* --clobber
      - name: Prune assets no longer referenced by the index
        run: |
          # Keep exactly: index.json + its signature + every artifact the new index names
          # (current + previousVersions). Retired versions fall off the release here.
          # #1319 ledger #9: index.json.sig must stay in the keep-list or every publish
          # deletes the signature it just uploaded.
          jq -r '[.modules[] | .artifact, (.previousVersions[]?.artifact)] + ["index.json", "index.json.sig"] | .[]' \
            dist/registry/index.json > /tmp/keep.txt
          gh api "repos/${{ github.repository }}/releases/tags/modules" \
            --jq '.assets[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
            if ! grep -qxF "$name" /tmp/keep.txt; then
              echo "pruning $name"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            fi
          done

      # #1747: a failed publish used to produce nothing a human sees. The symptom for users is the
      # absence of something — no update offered, no error — which nobody goes looking for. This
      # files one issue and reuses it, so a run of failures does not bury the board.
      - name: File an issue if the publish failed
        if: failure()
        run: |
          TITLE="Module registry publish is failing"
          EXISTING="$(gh issue list --state open --label bug --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}

          Users are not being offered module updates until this publishes. If the log says an
          artifact changed without a version bump, see #1747 — a change to a shared package
          bundled into every module re-packs all of them."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --body "$BODY"
          fi
