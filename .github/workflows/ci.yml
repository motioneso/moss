name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for change detection"
        required: false
        type: string

      rust_tier:
        description: "Rust tier to verify on this ref (same routing as PR, main, nightly)"
        type: choice
        options: [pull_request, push, schedule]
        default: push
      live_candidate:
        description: "Include the nightly Scratchpad live gate in another tier"
        type: boolean
        default: false

# Superseded PR commits yield runners; other events get independent groups so
# even pending main, nightly and manual runs cannot replace one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Skip onnxruntime's optional CUDA download from GitHub releases on every install.
# Embeddings run on CPU, and a slow GitHub release mirror failed CI (2026-11-08).
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # Classifies a PR as docs-only so the heavy jobs can be skipped. Measured 2026-07-27:
  # a docs-only PR paid ~35 min of CI (verify 21m + the sequential publish build 13.5m)
  # to validate nothing but prettier formatting. Push events always classify as
  # code so main and releases keep the full gate unconditionally.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      rust_only: ${{ steps.scope.outputs.rust_only }}
      rust_modules: ${{ steps.scope.outputs.rust_modules }}
      rust_entries: ${{ steps.scope.outputs.rust_entries }}
      host_changed: ${{ steps.scope.outputs.host_changed }}
      rust_tier: ${{ steps.scope.outputs.rust_tier }}

    steps:
      - name: Check out gate matrix definition
        uses: actions/checkout@v5

      - name: Validate gate matrix
        run: node --test tests/scripts/rust-gate-matrix.test.mjs

      - name: Classify changed paths
        id: scope
        env:
          # Passed as env, never interpolated into the script body — PR metadata is
          # attacker-controllable on fork PRs.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUST_TIER: ${{ inputs.rust_tier || github.event_name }}
          LIVE_CANDIDATE: ${{ inputs.live_candidate || false }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Both outputs default to the full gate; any early exit below keeps them false.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "rust_only=false" >> "$GITHUB_OUTPUT"
          echo "host_changed=true" >> "$GITHUB_OUTPUT"
          echo "rust_tier=$RUST_TIER" >> "$GITHUB_OUTPUT"
          host_changed=true
          # Modules the required rust-modules job gates: every module with a package gate.
          ALL_MODULES='["backtrack","briefings","calendar","commitments","connectors","email","finance","goals","meals","meetings","memory","news","notes","people","scratchpad","sports","tasks","weather","web-research","wellness"]'
          emit_modules() {
            echo "rust_modules=$1" >> "$GITHUB_OUTPUT"
            echo "rust_entries=$(node scripts/rust-gate-matrix.mjs "$1" "$RUST_TIER" "$host_changed" "$LIVE_CANDIDATE")" >> "$GITHUB_OUTPUT"
          }
          # Unknown PR scope conservatively runs all modules and host gates.
          # Main and nightly always run all modules; nightly also runs every host gate.
          emit_modules "$ALL_MODULES"
          # Keep main's existing legacy-JS classification below; Rust still runs its
          # full matrix regardless of the paths. Manual main/nightly proof needs no file list.
          if [ "$RUST_TIER" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then exit 0; fi
          # Push events have no pull request file list, so look up the PR that produced the
          # commit. That PR only covers the whole push when the push is exactly one commit
          # (squash merges), so a longer range, a failed compare or an empty lookup runs the
          # full gate.
          if [ "$EVENT_NAME" = "push" ]; then
            count=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$SHA" --jq '.total_commits' || true)
            if [ "${count:-0}" != "1" ]; then
              echo "Push is not exactly one commit (${count:-unknown}) — running the full gate."
              exit 0
            fi
            PR_NUMBER=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
            if [ -z "${PR_NUMBER:-}" ]; then
              echo "No merged PR found for $SHA — running the full gate."
              exit 0
            fi
          elif [ "$EVENT_NAME" != "pull_request" ] && [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request and no PR number provided — running the full gate."
            exit 0
          fi
          # Renames list both the new and the old path, so moving a file into a Rust tree
          # still counts the path it left.
          # The API file list avoids fetch-depth games and merge-base guesswork.
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > files.txt; then
            echo "File list lookup failed — running the full gate."
            exit 0
          fi
          echo "Changed files:"; cat files.txt
          if [ ! -s files.txt ]; then
            echo "No changed files listed — running the full gate."
            exit 0
          fi
          # Touched modules: a path under the module or its SQL, or a change to anything the
          # gates build against (all of rust-spike, crates the host pulls in from modules, the
          # test harness packages) or this workflow. Shared changes run the host tier.
          host_re='^(rust-spike/|modules/email/host/|modules/people/src/|packages/db/|package\.json$|pnpm-lock\.yaml$|infra/postgres/migrations/|scripts/(run-gate\.sh|rust-gate-matrix\.mjs)$|\.github/ci-bin/|\.github/workflows/ci\.yml$)'
          host_changed=false
          if grep -qE "$host_re" files.txt; then host_changed=true; fi
          touched=""
          for m in $(echo "$ALL_MODULES" | jq -r '.[]'); do
            if grep -qE "^(modules/$m/|packages/$m/sql/)" files.txt; then
              touched="$touched $m"
            fi
          done
          rust_modules=$(printf '%s\n' $touched | jq -R . | jq -sc 'map(select(length>0))')
          if [ "$RUST_TIER" = "push" ]; then rust_modules="$ALL_MODULES"; fi
          echo "host_changed=$host_changed" >> "$GITHUB_OUTPUT"
          emit_modules "$rust_modules"
          echo "Rust module gates: $rust_modules (host changed: $host_changed)"
          # rust_only == every changed path is docs or Rust. Rust means everything under
          # rust-spike/, every path inside a module package under modules/ (each one there is
          # a Rust package with a Cargo.toml: moss.module.json, ui/, tools/, tests and so on), and
          # the rust-*.yml workflows. Anything unsure (TypeScript, sql, css, package.json, other
          # .github/**) counts as not Rust. Counted rather than exit-code-tested: the safe
          # direction of a mistake here is "run the full gate".
          non_rust=$(grep -vcE '(^docs/|\.md$|^rust-spike/|^modules/[^/]+/|^\.github/workflows/rust-[^/]*\.yml$)' files.txt || true)
          if [ "${non_rust:-1}" -eq 0 ]; then
            echo "rust_only=true" >> "$GITHUB_OUTPUT"
            echo "Rust-only change — the old browser and unit tests are skipped."
          fi
          # Main keeps the full legacy gate except its existing Rust-only JS skips.
          if [ "$EVENT_NAME" = "push" ]; then exit 0; fi
          # docs-only == every changed path is under docs/ or is a markdown file.
          non_docs=$(grep -vcE '(^docs/|\.md$)' files.txt || true)
          if [ "${non_docs:-1}" -gt 0 ]; then
            echo "$non_docs non-doc file(s) changed — running the full gate."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — running formatting and file-size checks only."
          fi

  # Docs-only PRs still have to pass the gates that actually cover markdown:
  # prettier (format:check runs over `.`), check:file-size (its extension list
  # includes .md), and check:no-dev-password (a pasted password in a handoff note
  # is the most likely way the old dev password comes back, and that is exactly a
  # docs-only change). Skipping these would let unformatted docs reach main and break
  # the NEXT PR's format:check — the failure mode this filter must not introduce.
  docs-gate:
    name: Verify docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check file size
        run: pnpm check:file-size

      - name: Check for dev password
        run: pnpm check:no-dev-password

  verify:
    name: Verify static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:static

  unit:
    name: Verify unit tests (${{ matrix.shard }}/2)
    # Pinned: Playwright does not support Chromium on the Ubuntu 26.04 that ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The brokered Sports renderer unit smoke launches Chromium.
      - name: Install Chromium for unit tests
        run: |
          status=0
          for attempt in 1 2; do
            status=0
            # The timeout must own apt's privileges so it can stop apt before retrying.
            sudo env "PATH=$PATH" timeout --verbose --signal=TERM --kill-after=15s 5m \
              pnpm exec playwright install-deps chromium \
              && timeout --verbose --signal=TERM --kill-after=15s 5m \
                pnpm exec playwright install chromium \
              || status=$?
            if [ "$status" -eq 0 ]; then break; fi
          done
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=unit-chromium-install budget=5m-per-phase issue=#1534"
          fi
          exit "$status"

      - name: Install native vault ACL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl

      - name: Run unit tests
        env:
          MOSS_UNIT_TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          status=0
          timeout --verbose --signal=TERM 15m pnpm test:unit || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=unit-${{ matrix.shard }}-of-2 budget=15m issue=#1534"
          fi
          exit "$status"

  integration:
    name: Verify integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app map
        run: pnpm build:app-map

      - name: Start database
        run: pnpm db:up

      - name: Migrate database
        run: pnpm db:migrate

      - name: Audit release hardening
        if: matrix.shard == 1
        run: pnpm audit:release-hardening

      - name: Verify UAT seed
        if: matrix.shard == 1
        # #2989 backstop: the seed refuses to open a database outside a gate
        # run. CI's database is ephemeral per job (down -v below), so CI sets
        # the deliberate direct-use override explicitly.
        env:
          JARVIS_ALLOW_DIRECT_DB: "1"
        run: pnpm test:uat-seed

      - name: Run integration shard
        # #2989 backstop, same as above: CI's database is ephemeral per job.
        env:
          JARVIS_ALLOW_DIRECT_DB: "1"
        run: |
          status=0
          timeout --verbose --signal=TERM 30m pnpm test:integration tests/integration --shard=${{ matrix.shard }}/4 || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=integration-${{ matrix.shard }}-of-4 budget=30m issue=#1534"
          fi
          exit "$status"

      - name: Stop database
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # Required module gates for direct module changes; host gates for shared-code PRs.
  # Main runs all module files and controls; nightly adds all host gates.
  rust-modules:
    name: Rust gate (${{ matrix.module }} / ${{ matrix.suite }})
    # Playwright currently supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ${{ matrix.module == 'calendar' && matrix.suite == 'server' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.rust_tier == 'pull_request' && 60 || 120 }}
    needs: changes
    if: needs.changes.outputs.rust_entries != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.rust_entries) }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.rust-gate/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rust-gate/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rust-gate/target
      # Keep target folders small enough for a hosted runner disk.
      RUST_TEST_THREADS: "1"
      JARVIS_GATE_DIR: ${{ github.workspace }}/.rust-gate/logs
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make runner port claims available to the host and live suites
        run: echo "$GITHUB_WORKSPACE/.github/ci-bin" >> "$GITHUB_PATH"

      - name: Install Calendar gate Chromium
        if: matrix.module == 'calendar' && matrix.suite == 'server'
        run: |
          sudo python3 scripts/prepare-browser-apt-mirror.py
          sudo env "PATH=$PATH" timeout --verbose --signal=TERM --kill-after=15s 5m pnpm exec playwright install-deps chromium
          timeout --verbose --signal=TERM --kill-after=15s 5m pnpm exec playwright install chromium

      - name: Provision the assembly gate's declared Linux dependencies
        if: matrix.module == 'host' && matrix.suite == 'module-assembly'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev python3-gi dbus-daemon
          # The notification fixture imports system GIO bindings. Use the matching
          # distro Python rather than a runner tool-cache Python with a different ABI.
          mkdir -p "$RUNNER_TEMP/assembly-bin"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/assembly-bin/python3"
          echo "$RUNNER_TEMP/assembly-bin" >> "$GITHUB_PATH"

      - name: Disk before
        run: df -h / /tmp

      - name: Provision the declared Rust toolchain and target
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip2

      - name: Restore the shared Cargo home
        id: cargo-home
        uses: actions/cache/restore@v4
        with:
          path: .rust-gate/cargo
          key: cargo-home-${{ hashFiles('modules/**/Cargo.lock', 'rust-spike/**/Cargo.lock') }}
          restore-keys: cargo-home-

      # The gates run with --offline, so every crate any module needs is fetched here. One
      # shared Cargo home serves all jobs, so each job fetches every lockfile.
      - name: Fetch crates
        run: |
          set -euo pipefail
          while read -r lock; do
            cargo +1.95.0 fetch --locked --manifest-path "$(dirname "$lock")/Cargo.toml"
          done < <(find modules rust-spike -name Cargo.lock -not -path '*/target/*' -not -path '*/node_modules/*' | sort)
          du -sh "$CARGO_HOME"

      - name: Save the shared Cargo home
        if: steps.cargo-home.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .rust-gate/cargo
          key: cargo-home-${{ hashFiles('modules/**/Cargo.lock', 'rust-spike/**/Cargo.lock') }}

      - name: Run the module gates
        env:
          MODULE: ${{ matrix.module }}
          SUITE: ${{ matrix.suite }}
          GATES: ${{ matrix.gates }}
          MEMORY_CONTROLS: ${{ matrix.controls || 'all' }}
          CONNECTORS_CONTROLS: ${{ matrix.controls || 'all' }}
          EVENT_NAME: ${{ needs.changes.outputs.rust_tier }}
        run: |
          set -uo pipefail
          # Per-PR tier (docs/rust-gate-controls.md): skip Connectors' long speed test on PRs.
          if [ "$EVENT_NAME" = "pull_request" ]; then export CONNECTORS_SKIP_SYNC_SPEED=1; fi
          case "$MODULE" in
            memory) if [ "$GATES" = test:rust-memory ]; then export MEMORY_SUITE="$SUITE"; fi ;;
            news) if [ "$GATES" = test:rust-news ]; then export NEWS_SUITE="$SUITE"; fi ;;
            connectors) export CONNECTORS_SUITE="$SUITE" ;;
            people) export JS177_PEOPLE_FUEL=200000000 ;;
          esac
          failed=0
          for gate in $GATES; do
            start=$(date +%s)
            start_rc=0
            scripts/run-gate.sh start --gate "$gate" > "$RUNNER_TEMP/start.out" || start_rc=$?
            cat "$RUNNER_TEMP/start.out"
            log=$(sed -n 's/^LOG=//p' "$RUNNER_TEMP/start.out" | head -1)
            if [ -n "$log" ]; then echo "$log" >> "$RUNNER_TEMP/rust-gate-logs"; fi
            if [ "$start_rc" -ne 0 ]; then echo "Gate launch failed: $gate ($start_rc)"; failed=1; continue; fi
            if [ -z "$log" ]; then echo "run-gate start gave no log path for $gate"; failed=1; continue; fi
            rc=0
            scripts/run-gate.sh wait --follow --log "$log" || rc=$?
            echo "GATE_RESULT gate=$gate module=$MODULE entry=$SUITE exit=$rc seconds=$(( $(date +%s) - start ))"
            if [ "$rc" -ne 0 ]; then
              failed=1
              echo "::group::Last lines of the $gate log"
              tail -n 80 "$log"
              echo "::endgroup::"
            fi
          done
          exit $failed

      # wait --follow only prints the final verdict. Retain bounded compile/test timings even
      # for green gates and cancellations, so the next split is based on measured test files.
      - name: Compile and test file timings
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rust-gate-logs" ]; then
            while IFS= read -r log; do
              echo "::group::Compile and test timings: $(basename "$log")"
              grep -E '^ *Finished |^ *Running .*tests/|^test result:' "$log" | tail -n 180 || true
              echo "::endgroup::"
            done < "$RUNNER_TEMP/rust-gate-logs"
          fi

      - name: Disk after
        if: always()
        run: |
          df -h / /tmp
          du -sh "$CARGO_TARGET_DIR" "$CARGO_HOME" 2>/dev/null || true

  browser:
    name: Verify web and browser tests (${{ matrix.shard }}/2)
    # Pinned: Playwright does not support Chromium on the Ubuntu 26.04 that ubuntu-latest now is.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_only != 'true'
    # Keep each complete shard inside the existing phase budget; do not cancel its sibling.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Azure's archive can stream packages too slowly for the bounded install.
      - name: Use standard Ubuntu archive for browser dependencies
        run: |
          sudo python3 scripts/prepare-browser-apt-mirror.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #1724: Bound system dependencies separately from runner-owned browser downloads.
      - name: Install Playwright browsers
        run: |
          status=0
          for attempt in 1 2; do
            status=0
            # The timeout must own apt's privileges so it can stop apt before retrying.
            sudo env "PATH=$PATH" timeout --verbose --signal=TERM --kill-after=15s 5m \
              pnpm exec playwright install-deps chromium \
              && timeout --verbose --signal=TERM --kill-after=15s 5m \
                pnpm exec playwright install chromium \
              || status=$?
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::warning title=Playwright install timed out::attempt $attempt of 2 hit a 5m phase budget"
            fi
          done
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=playwright-install budget=5m-per-phase issue=#1534"
          fi
          exit "$status"

      - name: Build web
        run: pnpm build:web

      - name: Run Playwright smoke tests
        run: |
          status=0
          timeout --verbose --signal=TERM 10m pnpm test:e2e --shard=${{ matrix.shard }}/2 || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=playwright-${{ matrix.shard }}-of-2 budget=10m issue=#1534"
          fi
          exit "$status"

      # #1872: the default e2e config above serves a plain `vite dev` server, which never
      # registers the Service Worker (registration is gated to production builds). This is
      # the only path that exercises the real, registered worker in a browser.
      - name: Run Service Worker regression test
        if: matrix.shard == 1
        run: |
          status=0
          timeout --verbose --signal=TERM 5m pnpm test:sw || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=playwright-sw budget=5m issue=#1872"
          fi
          exit "$status"

  compose-smoke:
    name: Compose deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    env:
      JARVIS_API_PORT: "3099"
      JARVIS_WEB_PORT: "5180"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Compose smoke
        run: pnpm smoke:compose -- --api-port 3099

      - name: Stop Compose stack
        if: always()
        run: docker compose -p jarv1s-dev-smoke -f infra/docker-compose.yml down -v

  prod-compose-smoke:
    name: Prod compose deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Assert .dockerignore excludes the secrets env file (before it exists)
        run: |
          grep -q '^infra/env.production.local$' .dockerignore \
            || { echo "::error::.dockerignore must explicitly exclude infra/env.production.local before the smoke writes it"; exit 1; }
      - name: Write smoke env file
        run: |
          cat > infra/env.production.local <<'EOF'
          NODE_ENV=production
          POSTGRES_PASSWORD=postgres
          JARVIS_BOOTSTRAP_DATABASE_URL=postgres://postgres:postgres@postgres:5432/jarv1s
          JARVIS_MIGRATION_DATABASE_URL=postgres://jarvis_migration_owner:ci-migration-pw@postgres:5432/jarv1s
          JARVIS_APP_DATABASE_URL=postgres://jarvis_app_runtime:ci-app-pw@postgres:5432/jarv1s
          JARVIS_AUTH_DATABASE_URL=postgres://jarvis_auth_runtime:ci-auth-pw@postgres:5432/jarv1s
          JARVIS_WORKER_DATABASE_URL=postgres://jarvis_worker_runtime:ci-worker-pw@postgres:5432/jarv1s
          BETTER_AUTH_SECRET=smoke-only-not-a-real-secret-0000000000
          JARVIS_CONNECTOR_SECRET_KEY=00000000000000000000000000000000
          JARVIS_INTEGRATIONS_SECRET_KEY=33333333333333333333333333333333
          JARVIS_AI_SECRET_KEY=11111111111111111111111111111111
          JARVIS_MODULE_CREDENTIAL_SECRET_KEY=22222222222222222222222222222222
          JARVIS_NEWS_CREDENTIAL_SECRET_KEY=22222222222222222222222222222222
          JARVIS_CLI_RUNNER_RPC_SECRET=ci-smoke-only-not-real
          JARVIS_EMBED_PROVIDER=stub
          # #1313: this smoke instance runs NODE_ENV=production (not the vitest NODE_ENV=test
          # signal), so without this explicit escape hatch createEmbeddingProvider would now
          # refuse "stub" and silently fall back to "local" -- reintroducing exactly the
          # real-model network download this smoke instance is built to avoid.
          JARVIS_ALLOW_STUB_EMBEDDINGS=1
          EOF
      - name: Run prod compose smoke (builds images + in-image migrate)
        env:
          JARVIS_IMAGE_TAG: ci-${{ github.run_id }}
          # Compose resolves a service `env_file:` relative to the compose file dir
          # (infra/), so this is infra-relative — NOT ./infra/... (which would become
          # infra/infra/... and fail). Codex deploy-code R1 #1.
          JARVIS_ENV_FILE: ./env.production.local
          # POSTGRES_PASSWORD + JARVIS_CLI_RUNNER_RPC_SECRET are Compose INTERPOLATION
          # vars (env_file does not feed them); the prod Compose requires them (`:?`),
          # so set them in the shell env.
          POSTGRES_PASSWORD: postgres
          JARVIS_CLI_RUNNER_RPC_SECRET: ci-smoke-only-not-real
        run: |
          pnpm smoke:compose:prod
      - name: Stop prod compose stack
        if: always()
        run: JARVIS_IMAGE_TAG=ci-${{ github.run_id }} JARVIS_ENV_FILE=./env.production.local POSTGRES_PASSWORD=postgres JARVIS_CLI_RUNNER_RPC_SECRET=ci-smoke-only-not-real docker compose -p jarv1s-prod-smoke -f infra/docker-compose.prod.yml down -v

  # #895: the single required status check. Every heavy job is conditional on
  # `docs_only` (and unit and browser on `rust_only`), so naming an
  # individual job as required would deadlock whichever path skips it. This job
  # aggregates all of them under one name that is correct on both paths and fails
  # closed on `cancelled` (a 35-minute job timeout in this repo, not a benign skip).
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        docs-gate,
        verify,
        unit,
        integration,
        browser,
        compose-smoke,
        prod-compose-smoke,
        rust-modules
      ]
    if: always()

    steps:
      - name: Check required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=""
          for job in changes docs-gate verify unit integration browser compose-smoke prod-compose-smoke rust-modules; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg job "$job" '.[$job].result')
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              *) failed="$failed $job=$result" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error title=CI gate failed::Required job(s) did not pass:$failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped."

  build-image:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [verify, unit, integration, browser, compose-smoke, prod-compose-smoke]
    # always() so a skipped unit or browser job (Rust-only push) still builds the image.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      (needs.unit.result == 'success' || needs.unit.result == 'skipped') &&
      needs.integration.result == 'success' && needs.compose-smoke.result == 'success' &&
      needs.prod-compose-smoke.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Moss image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/motioneso/moss:edge-${{ matrix.arch }}
          # #1936: bake the tested commit into the image so Settings > Host > Technical details
          # can show it. The release tag is applied later when this edge image is promoted.
          build-args: |
            JARVIS_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=moss-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=moss-${{ matrix.arch }}

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify edge manifest
        env:
          IMAGE: ghcr.io/motioneso/moss
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:edge" \
            "$IMAGE:edge-amd64" \
            "$IMAGE:edge-arm64"
          manifest=$(docker buildx imagetools inspect "$IMAGE:edge")
          grep -q 'linux/amd64' <<< "$manifest"
          grep -q 'linux/arm64' <<< "$manifest"
