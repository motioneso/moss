name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  # Classifies a PR as docs-only so the heavy jobs can be skipped. Measured 2026-07-27:
  # a docs-only PR paid ~35 min of CI (verify 21m + the sequential publish build 13.5m)
  # to validate nothing but prettier formatting. Push/tag events always classify as
  # code so main and releases keep the full gate unconditionally.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Classify changed paths
        id: scope
        env:
          # Passed as env, never interpolated into the script body — PR metadata is
          # attacker-controllable on fork PRs.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running the full gate."
            exit 0
          fi
          # The API file list avoids fetch-depth games and merge-base guesswork.
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > files.txt
          echo "Changed files:"; cat files.txt
          # docs-only == every changed path is under docs/ or is a markdown file.
          # Anything else (source, sql, css, package.json, .github/**) forces the full gate.
          # Counted rather than exit-code-tested: `grep -v … >/dev/null` is easy to get
          # subtly wrong, and the safe direction of a mistake here is "run the full gate".
          non_docs=$(grep -vcE '(^docs/|\.md$)' files.txt || true)
          if [ ! -s files.txt ] || [ "${non_docs:-1}" -gt 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "$non_docs non-doc file(s) changed — running the full gate."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — running formatting and file-size checks only."
          fi

  # Docs-only PRs still have to pass the two gates that actually cover markdown:
  # prettier (format:check runs over `.`) and check:file-size (its extension list
  # includes .md). Skipping these would let unformatted docs reach main and break
  # the NEXT PR's format:check — the failure mode this filter must not introduce.
  docs-gate:
    name: Verify docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check file size
        run: pnpm check:file-size

  verify:
    name: Verify foundation and app
    runs-on: ubuntu-latest
    timeout-minutes: 45 # #1534: phase deadlines preserve fast failure within this backstop
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start database
        run: pnpm db:up

      - name: Verify foundation
        run: |
          status=0
          timeout --verbose --signal=TERM 30m pnpm verify:foundation || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=verify-foundation budget=30m issue=#1534"
          fi
          exit "$status"

      - name: Verify release hardening
        run: pnpm test:release-hardening

      - name: Audit release hardening
        run: pnpm audit:release-hardening

      - name: Build web
        run: pnpm build:web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: |
          status=0
          timeout --verbose --signal=TERM 10m pnpm test:e2e || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=CI phase timeout::CI_PHASE_TIMEOUT phase=playwright budget=10m issue=#1534"
          fi
          exit "$status"

      - name: Stop database
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  compose-smoke:
    name: Compose deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    env:
      JARVIS_API_PORT: "3099"
      JARVIS_WEB_PORT: "5180"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Compose smoke
        run: pnpm smoke:compose -- --api-port 3099

      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  prod-compose-smoke:
    name: Prod compose deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Assert .dockerignore excludes the secrets env file (before it exists)
        run: |
          grep -q '^infra/env.production.local$' .dockerignore \
            || { echo "::error::.dockerignore must explicitly exclude infra/env.production.local before the smoke writes it"; exit 1; }
      - name: Write smoke env file
        run: |
          cat > infra/env.production.local <<'EOF'
          NODE_ENV=production
          POSTGRES_PASSWORD=postgres
          JARVIS_BOOTSTRAP_DATABASE_URL=postgres://postgres:postgres@postgres:5432/jarv1s
          JARVIS_MIGRATION_DATABASE_URL=postgres://jarvis_migration_owner:ci-migration-pw@postgres:5432/jarv1s
          JARVIS_APP_DATABASE_URL=postgres://jarvis_app_runtime:ci-app-pw@postgres:5432/jarv1s
          JARVIS_AUTH_DATABASE_URL=postgres://jarvis_auth_runtime:ci-auth-pw@postgres:5432/jarv1s
          JARVIS_WORKER_DATABASE_URL=postgres://jarvis_worker_runtime:ci-worker-pw@postgres:5432/jarv1s
          BETTER_AUTH_SECRET=smoke-only-not-a-real-secret-0000000000
          JARVIS_CONNECTOR_SECRET_KEY=00000000000000000000000000000000
          JARVIS_AI_SECRET_KEY=11111111111111111111111111111111
          JARVIS_MODULE_CREDENTIAL_SECRET_KEY=22222222222222222222222222222222
          JARVIS_CLI_RUNNER_RPC_SECRET=ci-smoke-only-not-real
          JARVIS_EMBED_PROVIDER=stub
          # #1313: this smoke instance runs NODE_ENV=production (not the vitest NODE_ENV=test
          # signal), so without this explicit escape hatch createEmbeddingProvider would now
          # refuse "stub" and silently fall back to "local" -- reintroducing exactly the
          # real-model network download this smoke instance is built to avoid.
          JARVIS_ALLOW_STUB_EMBEDDINGS=1
          EOF
      - name: Run prod compose smoke (builds images + in-image migrate)
        env:
          JARVIS_IMAGE_TAG: ci-${{ github.run_id }}
          # Compose resolves a service `env_file:` relative to the compose file dir
          # (infra/), so this is infra-relative — NOT ./infra/... (which would become
          # infra/infra/... and fail). Codex deploy-code R1 #1.
          JARVIS_ENV_FILE: ./env.production.local
          # POSTGRES_PASSWORD + JARVIS_CLI_RUNNER_RPC_SECRET are Compose INTERPOLATION
          # vars (env_file does not feed them); the prod Compose requires them (`:?`),
          # so set them in the shell env.
          POSTGRES_PASSWORD: postgres
          JARVIS_CLI_RUNNER_RPC_SECRET: ci-smoke-only-not-real
        run: |
          pnpm smoke:compose:prod
      - name: Stop prod compose stack
        if: always()
        run: JARVIS_IMAGE_TAG=ci-${{ github.run_id }} JARVIS_ENV_FILE=./env.production.local POSTGRES_PASSWORD=postgres JARVIS_CLI_RUNNER_RPC_SECRET=ci-smoke-only-not-real docker compose -p jarv1s-prod-smoke -f infra/docker-compose.prod.yml down -v

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, compose-smoke, prod-compose-smoke]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Pre-pull BuildKit image
        run: |
          for attempt in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          docker pull moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "image_tags=ghcr.io/motioneso/moss:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "image_tags=ghcr.io/motioneso/moss:edge" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_tags=ghcr.io/motioneso/moss:pr-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on tag/main) Moss image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
