[package]
name = "moss-notes-checks"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
moss-module-ui = { path = "../../../rust-spike/module-ui", features = ["ssr"] }
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
moss-network = { path = "../../../rust-spike/network" }
vault = { path = "../../../rust-spike/vault" }
moss-module-host = { path = "../../../rust-spike/module-host" }
moss-platform-jobs = { path = "../../../rust-spike/module-host/bridges/jobs" }
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
access-context = { path = "../../../rust-spike/access-context" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"

[profile.dev]
debug = 0

[[bin]]
name = "notes-pack"
path = "src/pack.rs"

[[bin]]
name = "notes-ui-check"
path = "src/ui_server.rs"
