[package]
name = "moss-finance-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "Guest-safe Finance: accounts and manual entries"

[workspace]

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
serde = { version = "1", features = ["derive"] }
# Keep approval input bytes and digest input stable across the host and Wasm boundary.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "=1.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[test]]
name = "finance"
path = "../tests/finance.rs"

[[test]]
name = "privacy"
path = "../tests/privacy.rs"

[[test]]
name = "transactions"
path = "../tests/transactions.rs"

[[test]]
name = "import"
path = "../tests/import.rs"

[[test]]
name = "isolation"
path = "../tests/isolation.rs"
