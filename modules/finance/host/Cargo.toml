[package]
name = "moss-finance-host"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[workspace]

[dependencies]
anyhow = "1"
moss-module-host = { path = "../../../rust-spike/module-host" }
access-context = { path = "../../../rust-spike/access-context" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "net"] }
axum = "0.8"
chrono = "0.4"
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
moss-network = { path = "../../../rust-spike/network" }
moss-platform-jobs = { path = "../../../rust-spike/module-host/bridges/jobs" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }

[dev-dependencies]
moss-standins = { path = "../../../rust-spike/standins" }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
moss-platform-jobs = { path = "../../../rust-spike/module-host/bridges/jobs" }
base64 = "0.22"
ring = "0.17"
chrono = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.dev]
debug = 0
