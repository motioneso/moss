[package]
name = "moss-scratchpad-host"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[workspace]

[dependencies]
anyhow = "1"
moss-module-host = { path = "../../../rust-spike/module-host" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }

[dev-dependencies]
access-context = { path = "../../../rust-spike/access-context" }
moss-scratchpad-module = { path = "../src" }
ring = "0.17"
base64 = "0.22"
chrono = "0.4"
tempfile = "3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.dev]
debug = 0
