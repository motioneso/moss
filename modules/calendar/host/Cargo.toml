[package]
name = "moss-calendar-host"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[[example]]
name = "ui_check"
path = "examples/ui_check.rs"

[[example]]
name = "signed_ui"
path = "examples/signed_ui.rs"
required-features = ["web"]

[features]
web = ["dep:axum", "dep:moss-network", "dep:tower", "dep:tower-http"]

[workspace]

[dependencies]
anyhow = "1"
moss-module-host = { path = "../../../rust-spike/module-host" }
moss-calendar = { path = "../src" }
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
access-context = { path = "../../../rust-spike/access-context" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
wat = "=1.239.0"
axum = { version = "0.8", optional = true }
moss-network = { path = "../../../rust-spike/network", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[dev-dependencies]
moss-platform-jobs = { path = "../../../rust-spike/module-host/bridges/jobs" }
base64 = "0.22"
ring = "0.17"
chrono = "0.4"
tempfile = "3"

[profile.dev]
debug = 0
