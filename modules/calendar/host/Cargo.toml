[package]
name = "moss-calendar-host"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[[example]]
name = "ui_check"
path = "examples/ui_check.rs"

[workspace]

[dependencies]
anyhow = "1"
moss-module-host = { path = "../../../rust-spike/module-host" }
moss-calendar = { path = "../src" }
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
access-context = { path = "../../../rust-spike/access-context" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
wat = "=1.239.0"

[dev-dependencies]
moss-platform-jobs = { path = "../../../rust-spike/module-host/bridges/jobs" }
base64 = "0.22"
ring = "0.17"
chrono = "0.4"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.dev]
debug = 0
