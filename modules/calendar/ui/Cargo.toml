[package]
name = "moss-calendar-ui"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr", "moss-module-ui/ssr"]
csr = ["leptos/csr", "moss-module-ui/csr"]

[dependencies]
moss-module-ui = { path = "../../../rust-spike/module-ui" }
leptos = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "Event", "EventTarget", "KeyboardEvent", "Node"] }

[[bin]]
name = "calendar-ui-model"
path = "src/bin/model.rs"

[profile.dev]
debug = 0
