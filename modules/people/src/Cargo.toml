[package]
name = "moss-people"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
component = ["moss-module-sdk/component"]

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[test]]
name = "note_edits"
path = "tests/note_edits.rs"
