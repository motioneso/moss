[package]
name = "moss-people"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
component = ["moss-module-sdk/component"]
generated-component = ["dep:wit-bindgen"]

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "=0.1.26"
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"], optional = true }

[[test]]
name = "note_edits"
path = "tests/note_edits.rs"
