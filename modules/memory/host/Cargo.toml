[package]
name = "moss-memory-host"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[workspace]

[dependencies]
anyhow = "1"
moss-module-host = { path = "../../../rust-spike/module-host" }
access-context = { path = "../../../rust-spike/access-context" }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
wat = "=1.239.0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
safety-core = { path = "../../../rust-spike/safety-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }

[profile.dev]
debug = 0
