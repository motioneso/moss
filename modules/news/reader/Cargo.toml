[package]
name = "moss-news-reader"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
description = "Pure feed reader shared by News and Sports: RSS and Atom, sanitising, subreddit feeds, publisher identity"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
scraper = { version = "=0.29.0", default-features = false }
quick-xml = "=0.42.0"
psl = "=2.1.253"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "live_read"
path = "tools/live_read.rs"

[[test]]
name = "privacy"
path = "tests/privacy.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"
harness = false

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
