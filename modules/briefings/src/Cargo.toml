[package]
name = "moss-briefings-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "Guest-safe Briefings definitions, runs and schedule alignment"

[workspace]

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
moss-module-sdk = { path = "../../../rust-spike/module-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
sha2 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[test]]
name = "definitions"
path = "../tests/definitions.rs"

[[test]]
name = "schedule"
path = "../tests/schedule.rs"

[[test]]
name = "runs"
path = "../tests/runs.rs"

[[test]]
name = "privacy"
path = "../tests/privacy.rs"

[[test]]
name = "run_job"
path = "../tests/run_job.rs"

[[test]]
name = "morning"
path = "../tests/morning.rs"

[[test]]
name = "gather"
path = "../tests/gather.rs"

[[test]]
name = "lenses"
path = "../tests/lenses.rs"
