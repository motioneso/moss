[package]
name = "moss-shell"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "One program: serves the UI shell to browsers, or opens it in a desktop window"

[dependencies]
moss-shell-contract = { path = "../contract", features = ["stub"] }
moss-network = { path = "../../network" }
safety-core = { path = "../../safety-core" }
uuid = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
tao = "0.34"
wry = "0.53"
