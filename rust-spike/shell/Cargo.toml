# Rust port Phase 4 part 1 (JS-40): UI shell, Today, chat drawer, desktop shell.
# Its own workspace so it never collides with the Phase 2 crates in rust-spike/Cargo.toml.
[workspace]
resolver = "2"
members = ["contract", "ui", "app"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The server and desktop shell favour speed over size.
[profile.release.package.moss-shell]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3
