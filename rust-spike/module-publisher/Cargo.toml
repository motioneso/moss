[package]
name = "moss-module-publisher"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "moss-module-publisher"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
moss-module-host = { path = "../module-host" }
ring = "0.17"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
wat = "=1.239.0"

[profile.dev]
debug = 0
