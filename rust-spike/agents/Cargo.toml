# Rust port Phase 3 (JS-42): chat runner, terminal layer, agent drivers, tool gateway, approvals.
# Its own workspace so it never collides with the other phases' crates.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "moss-agents"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runner process, agent drivers, Moss tool gateway and approval policy"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
subtle = "2"
getrandom = "0.3"
hex = "0.4"
portable-pty = "0.9"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
