[package]
name = "moss-standins"
version = "0.0.0"
edition = "2021"
publish = false

# Test-only stand-in servers for Google, IMAP and SMTP. Shipped nowhere: no module or app
# depends on this crate. Every dependency below is already in the workspace lock files.
[workspace]

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
