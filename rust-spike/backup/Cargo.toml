[package]
name = "moss-backup"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Phase 7 part 4: encrypted instance backups, a ledger, retention and a restore drill"

[[bin]]
name = "moss-backup"
path = "src/bin/moss-backup.rs"

[[bin]]
name = "backup-fixture"
path = "src/bin/backup-fixture.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bundled-db = { path = "../bundled-db" }
hex = "0.4"
keystore = { path = "../keystore" }
portability = { path = "../portability" }
postgres = "0.19"
rand = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
