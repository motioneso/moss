[package]
name = "keystore"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bip39 = "2"
hex = "0.4"
libc = "0.2"
portability = { path = "../portability" }
rand = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
