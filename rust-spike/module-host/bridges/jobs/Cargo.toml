[package]
name = "moss-platform-jobs"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
moss-platform-contracts = { path = "../contracts" }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
async-trait = "0.1"
cron = "0.15"
chrono-tz = "0.10"

# Compile the unchanged Phase 2b source; do not fork or modify its workspace.
[lib]
path = "../../../platform/jobs/src/lib.rs"

[lints.clippy]
# Matches the existing Phase 2b API; this bridge compiles its unchanged source.
too_many_arguments = "allow"
