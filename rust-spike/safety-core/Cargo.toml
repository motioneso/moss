[package]
name = "safety-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Phase 2 part 1: the safety core every Rust request, job and module goes through"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
hmac = "0.12"
portability = { path = "../portability" }
vault = { path = "../vault" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
