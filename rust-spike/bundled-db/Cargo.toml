[package]
name = "bundled-db"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Phase 1 spike: a bundled Postgres with pgvector, started, migrated and stopped by Rust"

[[bin]]
name = "moss-db"
path = "src/main.rs"

[dependencies]
hex = "0.4"
libc = "0.2"
portability = { path = "../portability" }
postgres = "0.19"
postgres-protocol = "0.6"
rand = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
