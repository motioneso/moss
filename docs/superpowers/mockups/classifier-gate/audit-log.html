<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model activity log - mockup</title><link rel="stylesheet" href="app.css">
<style>.al{width:100%;border-collapse:collapse}.al th{text-align:left;font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);font-weight:var(--weight-semibold);padding:var(--space-2) var(--space-3);border-bottom:2px solid var(--border-strong)}.al td{padding:var(--space-3);border-bottom:1px solid var(--border);vertical-align:top}.al td.num{font-variant-numeric:tabular-nums}.al-wrap{overflow-x:auto}.mk-filters{display:flex;gap:var(--space-4);flex-wrap:wrap;margin:var(--space-4) 0}.mk-filters .jds-field{min-width:150px}.fd-day{font-family:var(--font-display);font-size:var(--text-lg);font-weight:var(--weight-bold);margin:var(--space-5) 0 var(--space-2)}
.fd{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border);align-items:start}
.fd__ic{width:40px;height:40px;border-radius:var(--radius-md);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.fd__ic svg{width:20px;height:20px}.fd__ic.bad{color:var(--danger)}
.fd__t{font-weight:var(--weight-semibold)}.fd__o{color:var(--text-muted)}
.fd__m{color:var(--text-subtle);font-size:var(--text-xs);margin-top:2px}
.fd__r{text-align:right;display:flex;flex-direction:column;gap:var(--space-1);align-items:flex-end}</style></head><body>
<div class="mk-bar"><b>Mockup: model activity log</b>
<span class="mk-group"><span class="mk-label">State</span><span class="jds-segmented" id="views"></span></span>
<span class="mk-group"><span class="mk-label">Theme</span><span class="jds-segmented"><button class="jds-segmented__opt" data-pick="theme:light" aria-pressed="true">Light</button><button class="jds-segmented__opt" data-pick="theme:dark">Dark</button><button class="jds-segmented__opt" data-pick="theme:sage">Sage</button><button class="jds-segmented__opt" data-pick="theme:dusk">Dusk</button></span></span></div>
<div class="mk-page">
<h1 class="mk-h">Model activity <span id="t0"></span></h1>
<p class="mk-help">Every time Moss called a model.</p>
<div class="mk-filters" id="filters">
 <div class="jds-field"><label class="jds-label" for="f1">Kind</label><span class="jds-selectwrap"><select class="jds-select" id="f1"><option>All</option><option>Chat answer</option><option>Classifier</option><option>Background task</option></select></span></div>
 <div class="jds-field"><label class="jds-label" for="f2">Model</label><span class="jds-selectwrap"><select class="jds-select" id="f2"><option>All</option><option>Sonnet 5.5</option><option>Opus 5.5</option><option>Haiku 4.5</option><option>Llama 3.2 (local)</option></select></span></div>
 <div class="jds-field"><label class="jds-label" for="f3">Result</label><span class="jds-selectwrap"><select class="jds-select" id="f3"><option>All</option><option>Answered</option><option>Handled</option><option>Declined</option><option>Failed</option></select></span></div>
 <div class="jds-field"><label class="jds-label" for="f4">Time</label><span class="jds-selectwrap"><select class="jds-select" id="f4"><option>Last 7 days</option><option>Last 24 hours</option></select></span></div>
</div>
<div id="stage"></div>
<p class="mk-note" id="ret"></p>
</div>
<script src="switcher.js"></script>
<script>
var rows=[
['Today','9:41 am','Classifier','Look up today\'s calendar','Found 2 events','Haiku 4.5','Handled','search'],
['Today','9:41 am','Chat answer','Summarise this week','Wrote a short summary of the week','Sonnet 5.5','Answered','check'],
['Today','9:30 am','Background task','Morning briefing','Built the briefing from calendar and email','Opus 5.5','Answered','check'],
['Today','9:12 am','Classifier','Turn off the kitchen lights','Home hub did not answer; stopped, not retried','Haiku 4.5','Failed','power'],
['Today','8:50 am','Classifier','Hand to default model','Not a quick request, passed on','Haiku 4.5','Declined','send'],
['Today','8:50 am','Chat answer','Draft a note','Wrote a draft for you to edit','Sonnet 5.5','Answered','send'],
['Yesterday','9:07 pm','Classifier','Hand to default model','Needs earlier conversation, passed on','Llama 3.2 (local)','Declined','send'],
['Yesterday','9:07 pm','Chat answer','Adjust the lights','Could not reach the lights tool','Sonnet 5.5','Failed','power'],
['Yesterday','6:30 pm','Background task','Sort new email','Filed 6 emails into folders','Llama 3.2 (local)','Answered','check']];
var badge={Handled:'forest',Declined:'neutral',Failed:'red',Answered:'neutral'};
var IC={check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',send:'<path d="M21 3L3 11l7 3 3 7z"/>',power:'<path d="M12 3v8"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>'};
function feed(rs){var day='',h='';rs.forEach(function(r){if(r[0]!==day){day=r[0];h+='<div class="fd-day">'+day+'</div>'}
 h+='<div class="fd"><span class="fd__ic'+(r[6]==='Failed'?' bad':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[r[7]]+'</svg></span><div><div class="fd__t">'+r[3]+'</div><div class="fd__o">'+r[4]+'</div><div class="fd__m">'+r[1]+' - '+r[2]+' - '+r[5]+'</div></div><div class="fd__r"><span class="jds-badge jds-badge--'+badge[r[6]]+'">'+r[6]+'</span></div></div>'});return h+'<div style="border-top:1px solid var(--border)"></div>'}
var empty='<div class="jds-empty"><div class="jds-empty__title">No activity yet</div><div class="jds-empty__sub">Lines appear once Moss calls a model.</div></div>';
var none='<div class="jds-empty"><div class="jds-empty__title">No lines match these filters</div><div class="jds-empty__sub">Try a wider range.</div><button class="jds-btn jds-btn--secondary jds-btn--sm" id="clr">Clear filters</button></div>';
var fs=['f1','f2','f3','f4'];
function show(k){var v=fs.map(function(i){return document.getElementById(i).value});
 var rs=k==='empty'?[]:rows.filter(function(r){return (v[0]==='All'||r[1]===v[0])&&(v[1]==='All'||r[5]===v[1])&&(v[2]==='All'||r[6]===v[2])});
 if(k==='retention')rs=rs.slice(0,6);
 document.getElementById('stage').innerHTML=k==='empty'?empty:rs.length?feed(rs):none;
 var c=document.getElementById('clr');if(c)c.onclick=function(){fs.forEach(function(i){document.getElementById(i).selectedIndex=0});show(k)}}
var S={
 data:{l:'With lines'},
 filtered:{l:'Filtered: classifier, failed',pre:['Classifier','All','Failed']},
 nomatch:{l:'No matches',pre:['Background task','Opus 5.5','Failed']},
 empty:{l:'Empty',nof:1},
 retention:{l:'7-day retention',r:'Oldest line: 6 days 22 hours ago.'}
};
var vb=document.getElementById('views');
Object.keys(S).forEach(function(k){var b=document.createElement('button');b.className='jds-segmented__opt';b.textContent=S[k].l;b.dataset.k=k;vb.appendChild(b)});
function render(k){var s=S[k];history.replaceState(null,'','#'+k);[].forEach.call(vb.children,function(b){b.setAttribute('aria-pressed',b.dataset.k===k)});
 document.getElementById('t0').innerHTML=tip('Admins only. Keeping lines for 7 days is proposed, not decided.');
 fs.forEach(function(i,n){document.getElementById(i).selectedIndex=0;if(s.pre&&n<3){var o=document.getElementById(i);[].forEach.call(o.options,function(x,y){if(x.text===s.pre[n])o.selectedIndex=y})}});
 document.getElementById('filters').style.display=s.nof?'none':'flex';
 document.getElementById('ret').textContent=s.r||'';document.getElementById('ret').style.display=s.r?'block':'none';show(k)}
fs.forEach(function(i){document.getElementById(i).onchange=function(){show(location.hash.slice(1)||'data')}});
vb.onclick=function(e){if(e.target.dataset.k)render(e.target.dataset.k)};
render(location.hash.slice(1)||'data');
</script></body></html>
