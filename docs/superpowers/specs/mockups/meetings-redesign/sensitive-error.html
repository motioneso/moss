        <nav aria-label="Main">

              stroke="currentColor"

          ><a class="mock-nav-item" href="#"

              stroke-linejoin="round"
              stroke-width="1.6"
              viewbox="0 0 24 24"
            >
              <path d="m5 12 4 4L19 6"></path></svg
            ><span>Tasks</span></a
          ><a class="mock-nav-item" href="#"
            ><svg
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.6"
              viewbox="0 0 24 24"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
              <path d="M14 2v6h6M8 13h8m-8 4h6"></path></svg
            ><span>Notes</span></a
          ><a class="mock-nav-item selected" href="home-table.html"

              aria-hidden="true"

        <div class="sidebar-foot"><span class="avatar">J</span><span>Jamie</span></div>
      </aside>
      <div class="mock-workspace">
        <header class="mock-topbar">
          <div class="topbar-title">
            <span>Meetings</span
            ><button
              aria-label="Meetings settings"
              class="jds-iconbtn"
              data-settings=""
              title="Meetings settings"
            >
              <svg
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.6"
                viewbox="0 0 24 24"
              >
                <path
                  d="m9.7 4.3.5-2.3h3.6l.5 2.3 1.8 1 2.2-.7 1.8 3.1-1.7 1.6v2.1l1.7 1.6-1.8 3.1-2.2-.7-1.8 1-.5 2.3h-3.6l-.5-2.3-1.8-1-2.2.7-1.8-3.1 1.7-1.6V9.3L4.4 7.7l1.8-3.1 2.2.7Z"
                ></path>
                <circle cx="12" cy="10.4" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="topbar-actions">
            <button
              aria-label="Chat unavailable while meeting is locked"
              class="jds-iconbtn"
              disabled=""
              title="Chat with Moss"
            >
              <svg
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.6"
                viewbox="0 0 24 24"
              >
                <path
                  d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"
                ></path>
              </svg>
            </button>
          </div>
        </header>
        <div class="mock-body">
          <main class="locked-page">
            <a class="jds-btn jds-btn--link" href="home-table.html"
              ><svg
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.6"
                viewbox="0 0 24 24"
              >
                <path d="m15 18-6-6 6-6"></path></svg
              >All recordings</a
            >
            <section aria-labelledby="lock-heading" class="password-gate">
              <div class="lock-mark">
                <svg
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.6"
                  viewbox="0 0 24 24"
                >
                  <rect height="11" rx="2" width="14" x="5" y="10"></rect>
                  <path d="M8 10V6a4 4 0 0 1 8 0v4"></path>
                </svg>
              </div>
              <h1 id="lock-heading">Sensitive meeting</h1>
              <form data-password-form="">
                <label class="jds-label" for="app-password">App password</label
                ><input
                  aria-describedby="password-error"
                  aria-invalid="true"
                  autocomplete="off"
                  class="jds-input"
                  id="app-password"
                  required=""
                  type="password"
                />
                <p class="password-error" id="password-error" role="alert">
                  Incorrect password. Try again.
                </p>
                <div class="gate-actions">
                  <a class="jds-btn jds-btn--quiet" href="home-table.html">Cancel</a
                  ><button class="jds-btn jds-btn--primary">Unlock</button>
                </div>
              </form>
            </section>
          </main>
        </div>
      </div>
    </div>

    <div aria-live="polite" class="mock-status" role="status"></div>
