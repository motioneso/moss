<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recording · Close control · Moss mockup</title>
    <link rel="stylesheet" href="moss-ui.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="pill.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        font: inherit;
      }
      .meeting-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: var(--space-7);
      }
      @media (max-width: 720px) {
        .meeting-columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header
      style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-6);
        border-bottom: 1px solid var(--border);
      "
    >
      <strong style="font-family: var(--font-display); font-size: var(--text-xl)">moss</strong
      ><span class="jds-hint">Meetings</span
      ><span style="margin-left: auto"
        ><a href="04-settings.html" class="jds-btn jds-btn--quiet">Settings</a></span
      >
    </header>
    <main
      style="display: flex; flex-direction: column; gap: var(--space-7); padding: var(--space-6)"
    >
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3)">
        <div class="jds-section-head"><h1 class="jds-section-head__title">New meeting</h1></div>
        <span style="margin-left: auto"
          ><span class="jds-badge jds-badge--red">Recording</span></span
        >
      </div>
      <p class="jds-hint">MacBook Air · Connected</p>
      <div class="meeting-columns">
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Transcript</h2>
          </div>
          <p class="jds-hint" role="status">Listening…</p>
        </section>
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Notes</h2>
          </div>
          <textarea
            class="jds-input"
            aria-label="Notes"
            placeholder="Add a note…"
            style="min-height: 300px; resize: vertical"
          ></textarea>
        </section>
      </div>
      <aside style="position: fixed; bottom: var(--space-6); right: var(--space-6)">
        <div
          aria-label="Recording controls"
          class="meeting-recording-pill"
          data-close-visible="true"
          style="
            position: relative;
            width: 248px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-3);
            border: 0.8px solid var(--meeting-pill-border);
            border-radius: var(--radius-pill);
            background: var(--meeting-pill-surface);
            box-shadow: var(--shadow-md);
          "
        >
          <svg
            width="24"
            height="18"
            viewBox="0 0 32 24"
            role="img"
            aria-label="Three-bar captured audio level meter: static example"
          >
            <rect x="3" y="8" width="6" height="9" rx="3" fill="var(--danger)"></rect>
            <rect x="13" y="1" width="6" height="22" rx="3" fill="var(--danger)"></rect>
            <rect x="23" y="5" width="6" height="14" rx="3" fill="var(--danger)"></rect></svg
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Recording audio sources"
            title="Recording audio sources"
            aria-haspopup="menu"
            aria-expanded="false"
            data-source-trigger="true"
            style="
              width: 36px;
              height: 24px;
              min-width: 36px;
              min-height: 24px;
              padding: 0;
              display: flex;
              gap: 2px;
              color: var(--meeting-pill-pause-ink);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-mic"
              style="width: 14px; height: 14px"
            >
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" x2="12" y1="19" y2="22"></line></svg
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevron-down"
              style="width: 9px; height: 9px"
            >
              <path d="m6 9 6 6 6-6"></path>
            </svg></button
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Pause recording"
            title="Pause recording"
            style="
              width: 24px;
              height: 24px;
              min-width: 24px;
              min-height: 24px;
              padding: 0;
              border: 0.8px solid var(--meeting-pill-pause-ring);
              border-radius: var(--radius-pill);
              background: var(--meeting-pill-surface);
              color: var(--meeting-pill-pause-ink);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-pause"
              style="width: 10px; height: 10px"
            >
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            </svg></button
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Stop recording"
            title="Stop recording"
            style="
              width: 24px;
              height: 24px;
              min-width: 24px;
              min-height: 24px;
              padding: 0;
              border-radius: var(--radius-pill);
              background: var(--danger);
              color: var(--white);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="0"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-square"
              style="width: 10px; height: 10px"
            >
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            </svg></button
          ><span
            aria-hidden="true"
            data-close-divider="true"
            style="width: 1px; height: 16px; background: var(--meeting-pill-border)"
          ></span
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Hide recording pill"
            title="Hide recording pill"
            style="
              width: 20px;
              height: 20px;
              min-width: 20px;
              min-height: 20px;
              padding: 0;
              border-radius: var(--radius-pill);
              background: var(--meeting-pill-surface);
              color: var(--meeting-pill-pause-ink);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-x"
              style="width: 10px; height: 10px"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <div
            class="jds-menu__list meeting-source-menu"
            role="menu"
            aria-label="Recording audio sources"
            hidden=""
            data-source-menu="true"
          >
            <div role="group" aria-label="Microphone">
              <p class="jds-hint" style="padding: var(--space-2) var(--space-3)">Microphone</p>
              <button
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-source-choice="microphone"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-check"
                  aria-hidden="true"
                  style="width: 12px; height: 12px; opacity: 0"
                >
                  <path d="M20 6 9 17l-5-5"></path></svg
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-mic-off"
                  style="width: 14px; height: 14px"
                >
                  <line x1="2" x2="22" y1="2" y2="22"></line>
                  <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path>
                  <path d="M5 10v2a7 7 0 0 0 12 5"></path>
                  <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path>
                  <path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path>
                  <line x1="12" x2="12" y1="19" y2="22"></line></svg
                ><span>None</span></button
              ><button
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-source-choice="microphone"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-check"
                  aria-hidden="true"
                  style="width: 12px; height: 12px; opacity: 1"
                >
                  <path d="M20 6 9 17l-5-5"></path></svg
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-laptop"
                  style="width: 14px; height: 14px"
                >
                  <path
                    d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"
                  ></path></svg
                ><span>MacBook Air Microphone</span>
              </button>
            </div>
            <hr
              style="
                border: 0;
                border-top: 1px solid var(--border);
                margin: var(--space-2) var(--space-3);
              "
            />
            <div role="group" aria-label="System Audio">
              <p class="jds-hint" style="padding: var(--space-2) var(--space-3)">System Audio</p>
              <button
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-source-choice="system"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-check"
                  aria-hidden="true"
                  style="width: 12px; height: 12px; opacity: 0"
                >
                  <path d="M20 6 9 17l-5-5"></path></svg
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-volume-x"
                  style="width: 14px; height: 14px"
                >
                  <path
                    d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
                  ></path>
                  <line x1="22" x2="16" y1="9" y2="15"></line>
                  <line x1="16" x2="22" y1="9" y2="15"></line></svg
                ><span>No computer audio</span></button
              ><button
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-source-choice="system"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-check"
                  aria-hidden="true"
                  style="width: 12px; height: 12px; opacity: 1"
                >
                  <path d="M20 6 9 17l-5-5"></path></svg
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-volume2"
                  style="width: 14px; height: 14px"
                >
                  <path
                    d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
                  ></path>
                  <path d="M16 9a5 5 0 0 1 0 6"></path>
                  <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg
                ><span>Record computer audio</span>
              </button>
            </div>
          </div>
        </div>
      </aside>
    </main>
    <script src="pill-preview.js"></script>
  </body>
</html>
