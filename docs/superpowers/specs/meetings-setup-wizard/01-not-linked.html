<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not linked · Moss mockup</title>
    <link rel="stylesheet" href="moss-ui.css" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        font: inherit;
      }
      .meeting-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: var(--space-7);
      }
      @media (max-width: 720px) {
        .meeting-columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header
      style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-6);
        border-bottom: 1px solid var(--border);
      "
    >
      <strong style="font-family: var(--font-display); font-size: var(--text-xl)">moss</strong
      ><span class="jds-hint">Meetings</span
      ><span style="margin-left: auto"
        ><a href="04-settings.html" class="jds-btn jds-btn--quiet">Settings</a></span
      >
    </header>
    <main
      style="display: flex; flex-direction: column; gap: var(--space-7); padding: var(--space-6)"
    >
      <div class="jds-section-head"><h1 class="jds-section-head__title">Meetings</h1></div>
      <div class="jds-empty">
        <div class="jds-empty__title">Link your Mac</div>
        <div class="jds-empty__sub">Open Trail Marker and follow its linking instructions.</div>
        <div style="margin-top: var(--space-5)">
          <button type="button" class="jds-btn jds-btn--primary">Download app</button>
        </div>
      </div>
    </main>
  </body>
</html>
