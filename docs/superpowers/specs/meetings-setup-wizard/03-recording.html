<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recording · Moss mockup</title>
    <link rel="stylesheet" href="moss-ui.css" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        font: inherit;
      }
      .meeting-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: var(--space-7);
      }
      @media (max-width: 720px) {
        .meeting-columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header
      style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-6);
        border-bottom: 1px solid var(--border);
      "
    >
      <strong style="font-family: var(--font-display); font-size: var(--text-xl)">moss</strong
      ><span class="jds-hint">Meetings</span
      ><span style="margin-left: auto"
        ><a href="04-settings.html" class="jds-btn jds-btn--quiet">Settings</a></span
      >
    </header>
    <main
      style="display: flex; flex-direction: column; gap: var(--space-7); padding: var(--space-6)"
    >
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3)">
        <div class="jds-section-head"><h1 class="jds-section-head__title">New meeting</h1></div>
        <span style="margin-left: auto"
          ><span class="jds-badge jds-badge--red">Recording</span></span
        >
      </div>
      <p class="jds-hint">MacBook Air · Connected</p>
      <div class="meeting-columns">
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Transcript</h2>
          </div>
          <p class="jds-hint" role="status">Listening…</p>
        </section>
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Notes</h2>
          </div>
          <textarea
            class="jds-input"
            aria-label="Notes"
            placeholder="Add a note…"
            style="min-height: 300px; resize: vertical"
          ></textarea>
        </section>
      </div>
      <aside style="position: fixed; bottom: var(--space-6); right: var(--space-6)">
        <div
          aria-label="Recording controls"
          style="
            width: 200px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 calc(var(--space-6) * 0.8);
            border: 0.8px solid var(--meeting-pill-border);
            border-radius: var(--radius-pill);
            background: var(--meeting-pill-surface);
            box-shadow: var(--shadow-md);
          "
        >
          <svg
            width="25.6"
            height="19.2"
            viewBox="0 0 32 24"
            role="img"
            aria-label="Three-bar captured audio level meter: static example"
          >
            <rect x="3" y="8" width="6" height="9" rx="3" fill="var(--danger)"></rect>
            <rect x="13" y="1" width="6" height="22" rx="3" fill="var(--danger)"></rect>
            <rect x="23" y="5" width="6" height="14" rx="3" fill="var(--danger)"></rect></svg
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Pause recording"
            title="Pause recording"
            style="
              width: 43.2px;
              height: 43.2px;
              border: 0.8px solid var(--meeting-pill-pause-ring);
              border-radius: var(--radius-pill);
              background: var(--meeting-pill-surface);
              color: var(--meeting-pill-pause-ink);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-pause"
              style="width: 14.4px; height: 14.4px"
            >
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            </svg></button
          ><button
            type="button"
            class="jds-iconbtn"
            aria-label="Stop recording"
            title="Stop recording"
            style="
              width: 43.2px;
              height: 43.2px;
              border-radius: var(--radius-pill);
              background: var(--danger);
              color: var(--white);
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="0"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-square"
              style="width: 14.4px; height: 14.4px"
            >
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            </svg>
          </button>
        </div>
      </aside>
    </main>
  </body>
</html>
