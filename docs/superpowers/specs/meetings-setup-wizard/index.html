<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meetings · Moss mockup</title>
    <link rel="stylesheet" href="moss-ui.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        font: inherit;
      }
      .meeting-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: var(--space-7);
      }
      @media (max-width: 720px) {
        .meeting-columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main
      style="display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-7)"
    >
      <div class="jds-section-head"><h1 class="jds-section-head__title">Meetings</h1></div>
      <nav
        aria-label="Mockup states"
        style="display: flex; flex-direction: column; gap: var(--space-5); align-items: flex-start"
      >
        <a href="01-not-linked.html" class="jds-btn jds-btn--link">Not linked</a
        ><a href="02-ready.html" class="jds-btn jds-btn--link">Ready</a
        ><a href="03-recording.html" class="jds-btn jds-btn--link">Recording</a
        ><a href="04-settings.html" class="jds-btn jds-btn--link">Settings</a>
      </nav>
    </main>
  </body>
</html>
