<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ready · Moss mockup</title>
    <link rel="stylesheet" href="moss-ui.css" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: var(--leading-normal);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        font: inherit;
      }
      .meeting-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: var(--space-7);
      }
      @media (max-width: 720px) {
        .meeting-columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header
      style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-6);
        border-bottom: 1px solid var(--border);
      "
    >
      <strong style="font-family: var(--font-display); font-size: var(--text-xl)">moss</strong
      ><span class="jds-hint">Meetings</span
      ><span style="margin-left: auto"
        ><a href="04-settings.html" class="jds-btn jds-btn--quiet">Settings</a></span
      >
    </header>
    <main
      style="display: flex; flex-direction: column; gap: var(--space-7); padding: var(--space-6)"
    >
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3)">
        <div class="jds-section-head"><h1 class="jds-section-head__title">New meeting</h1></div>
        <span style="margin-left: auto"><span class="jds-badge jds-badge--forest">Ready</span></span
        ><button type="button" class="jds-btn jds-btn--primary">Start recording</button>
      </div>
      <p class="jds-hint">MacBook Air · Connected</p>
      <div class="meeting-columns">
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Transcript</h2>
          </div>
          <p class="jds-hint" role="status">Start when you’re ready.</p>
        </section>
        <section style="display: flex; flex-direction: column; gap: var(--space-5)">
          <div class="jds-section-head jds-section-head--rule">
            <h2 class="jds-section-head__title">Notes</h2>
          </div>
          <textarea
            class="jds-input"
            aria-label="Notes"
            placeholder="Add a note…"
            style="min-height: 300px; resize: vertical"
          ></textarea>
        </section>
      </div>
    </main>
  </body>
</html>
