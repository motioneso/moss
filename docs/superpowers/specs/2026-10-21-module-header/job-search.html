<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Search — header proposal</title>
    <link rel="stylesheet" href="mockups.css" />
  </head>
  <body>
    <!-- Static mockup. Illustrative states and draft marketing copy; no live data or settings behavior. -->
    <div class="mock-shell">
      <aside class="mock-nav" aria-label="Navigation context">
        <p class="mock-brand">Moss</p>
        <div class="mock-nav-list">
          <span class="">Today</span><span class="">Tasks</span><span class="">Calendar</span
          ><span class="">Finance</span><span class="selected">Job Search</span>
        </div>
      </aside>
      <div class="mock-workspace">
        <header class="mock-header">
          <button class="jds-iconbtn mock-menu" aria-label="Open navigation">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="mock-titles">
            <div class="mock-title-row">
              <h1 class="mock-title">Job Search</h1>
              <a
                class="jds-iconbtn mock-cog"
                href="/settings?section=modules&amp;module=job-search"
                aria-label="Job Search settings"
                title="Job Search settings"
                ><svg
                  width="19"
                  height="19"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M9.7 4.3 10.3 2h3.4l.6 2.3 2 .9 2.1-.6 1.7 2.9-1.5 1.7.2 2.2 1.7 1.6-1.7 3-2.2-.5-1.9 1-.5 2.3h-3.4l-.7-2.2-2-.9-2.1.6-1.7-3 1.5-1.7-.2-2.2-1.7-1.5 1.7-3 2.2.5z"
                  />
                  <circle cx="12" cy="10.8" r="3" /></svg
              ></a>
            </div>
            <p class="mock-tagline" title="Find your next good fit.">Find your next good fit.</p>
          </div>
          <div class="mock-status" role="status">
            <span class="jds-indicator jds-indicator--idle"
              ><span class="jds-indicator__dot"></span></span
            ><span>Searching for new roles…</span>
          </div>
          <div class="mock-actions">
            <button class="jds-iconbtn more" aria-label="More actions">
              <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="5" cy="12" r="1" />
                <circle cx="12" cy="12" r="1" />
                <circle cx="19" cy="12" r="1" />
              </svg></button
            ><button class="jds-iconbtn" aria-label="Open chat">
              <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2v-10a9 9 0 0 1 19-.5Z" />
              </svg>
            </button>
          </div>
        </header>
        <main class="mock-content">
          <div class="mock-tabs">
            <span>Board</span><span>Overview</span><span>Profile</span><span>Monitors</span>
          </div>
          <div class="section-row"><h2>Your matches</h2></div>
          <p class="mock-quiet">Your next role starts here.</p>
          <p class="mock-annotation">Header proposal · Job Search · illustrative state</p>
        </main>
      </div>
    </div>
  </body>
</html>
